# BearDog Cargo Deny Configuration (v2)
# Enforces dependency security, ecoBin purity, and quality standards

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RSA Marvin Attack (RUSTSEC-2023-0071): No upstream fix available.
    # RustCrypto RSA is the only pure-Rust RSA implementation.
    # BearDog uses Ed25519/X25519 as primary; RSA is legacy/interop only.
    "RUSTSEC-2023-0071",
    # paste (RUSTSEC-2024-0436): unmaintained but stable, no known vuln.
    # Transitive dep via rustls-rustcrypto — will drop when upstream removes.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # Pure-Rust CryptoProvider — tracks RustCrypto/rustls-rustcrypto main
    # until a stable crates.io release is published.
    "https://github.com/RustCrypto/rustls-rustcrypto",
]

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip = [
    # Transitive version splits — will resolve as upstream deps align.
    # Last audited: 2026-06-09
    { crate = "cpufeatures" },  # 0.2 (aes/sha2) + 0.3 (blake3)
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    { crate = "socket2" },  # 0.5 (local-ip-address) + 0.6 (tokio)
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "winnow" },

    # RustCrypto stable + RC version splits (rustls-rustcrypto uses RC crates)
    # These will converge once RustCrypto publishes stable releases.
    { crate = "aead" },
    { crate = "aes" },
    { crate = "aes-gcm" },
    { crate = "base16ct" },
    { crate = "block-buffer" },
    { crate = "chacha20" },
    { crate = "chacha20poly1305" },
    { crate = "cipher" },
    { crate = "const-oid" },
    { crate = "crypto-bigint" },
    { crate = "crypto-common" },
    { crate = "ctr" },
    { crate = "curve25519-dalek" },
    { crate = "der" },
    { crate = "digest" },
    { crate = "ecdsa" },
    { crate = "ed25519" },
    { crate = "ed25519-dalek" },
    { crate = "elliptic-curve" },
    { crate = "ff" },
    { crate = "fiat-crypto" },
    { crate = "ghash" },
    { crate = "group" },
    { crate = "hkdf" },
    { crate = "hmac" },
    { crate = "inout" },
    { crate = "p256" },
    { crate = "p384" },
    { crate = "pem-rfc7468" },
    { crate = "pkcs1" },
    { crate = "pkcs8" },
    { crate = "poly1305" },
    { crate = "polyval" },
    { crate = "primeorder" },
    { crate = "rfc6979" },
    { crate = "rsa" },
    { crate = "sec1" },
    { crate = "sha2" },
    { crate = "signature" },
    { crate = "spki" },
    { crate = "universal-hash" },
    { crate = "x25519-dalek" },
]
deny = [
    # ── Anti-patterns ────────────────────────────────────────────────────
    { crate = "async-trait" },

    # ── C/FFI crypto backends (hard ban — beardog IS the pure Rust alternative) ──
    #
    # Any crate that links C/C++ crypto code. If a transitive dep pulls one of
    # these in, the dep must be replaced or the feature must be disabled.
    # This list is the ecoBin purity contract.

    # OpenSSL family
    { crate = "openssl", wrappers = [] },
    { crate = "openssl-sys", wrappers = [] },
    { crate = "openssl-probe", wrappers = [] },

    # AWS libcrypto (C)
    { crate = "aws-lc-rs", wrappers = [] },
    { crate = "aws-lc-sys", wrappers = [] },

    # ring (C assembly)
    { crate = "ring", wrappers = [] },
    { crate = "ring-core", wrappers = [] },

    # BoringSSL / Google
    { crate = "boring", wrappers = [] },
    { crate = "boring-sys", wrappers = [] },

    # wolfSSL
    { crate = "wolfssl", wrappers = [] },
    { crate = "wolfssl-sys", wrappers = [] },

    # mbedTLS
    { crate = "mbedtls", wrappers = [] },
    { crate = "mbedtls-sys-auto", wrappers = [] },

    # libsodium
    { crate = "libsodium-sys", wrappers = [] },
    { crate = "sodiumoxide", wrappers = [] },
    { crate = "libsodium-sys-stable", wrappers = [] },

    # GnuTLS / Nettle
    { crate = "nettle-sys", wrappers = [] },

    # Legacy / compatibility traps
    { crate = "native-tls", wrappers = [] },
    { crate = "security-framework-sys", wrappers = [] },
    { crate = "schannel", wrappers = [] },

    # rcgen (was aws-lc-rs dependent — replaced by p256 + x509-cert)
    { crate = "rcgen", wrappers = [] },

    # ── C toolchain / FFI generators (prevent accidental C build deps) ───
    { crate = "bindgen", wrappers = [] },
    # cc: allowed only as blake3 build-dep (blake3 features=["pure"] disables C assembly)
    { crate = "cc", wrappers = ["blake3"] },
    { crate = "cmake", wrappers = [] },

    # ── Hardware FFI (replaced by pure-Rust beardog-hid) ─────────────────
    { crate = "hidapi", wrappers = [] },
]
skip-tree = []

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
]
all-features = false

# ── Pure-Rust Crypto — COMPLETE (Wave 104) ────────────────────────────
#
# aws-lc-rs and rcgen eliminated. TLS uses rustls-rustcrypto provider
# (pure Rust CryptoProvider from RustCrypto). CSR generation uses
# p256 + x509-cert. Zero C crypto dependencies remain.
#
# Full pure-Rust crypto stack: ed25519-dalek, x25519-dalek, p256, p384,
# chacha20poly1305, aes-gcm, sha2, sha3, blake3, hkdf, hmac, argon2,
# rsa, ecdsa, rand, rustls-rustcrypto, x509-cert
