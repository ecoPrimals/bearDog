# BearDog Cargo Deny Configuration (v2)
# Enforces dependency security, ecoBin purity, and quality standards

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RSA Marvin Attack (RUSTSEC-2023-0071): No upstream fix available.
    # RustCrypto RSA is the only pure-Rust RSA implementation.
    # BearDog uses Ed25519/X25519 as primary; RSA is legacy/interop only.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip = [
    # Transitive version splits — will resolve as upstream deps align.
    # Last audited: 2026-04-20 — removed 3 resolved single-version skips.
    { crate = "cpufeatures" },  # 0.2 (aes/sha2) + 0.3 (blake3)
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    { crate = "socket2" },  # 0.5 (local-ip-address) + 0.6 (tokio)
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "winnow" },
]
deny = [
    { crate = "async-trait" },
    { crate = "openssl", wrappers = [] },
    { crate = "openssl-sys", wrappers = [] },
    # ring eliminated — aws-lc-rs is the TLS crypto backend via rustls (Wave 125)
    { crate = "ring", wrappers = [] },
    { crate = "aws-lc-rs", wrappers = ["rustls", "rustls-webpki", "rcgen"] },
    { crate = "aws-lc-sys", wrappers = ["aws-lc-rs"] },
    { crate = "native-tls", wrappers = [] },
    { crate = "libsodium-sys", wrappers = [] },
    { crate = "hidapi", wrappers = [] },
    { crate = "bindgen", wrappers = [] },
]
skip-tree = []

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
]
all-features = false

# ── Pure-Rust Crypto Horizon (P3, Phase 2) ──────────────────────────────
#
# aws-lc-rs provides production-grade crypto but depends on aws-lc-sys (C).
# Target: replace with pure-Rust alternatives when mature.
#
# Tracking:
#   rustls-rustcrypto — not yet production-ready (experimental)
#   rcgen alternatives — p256 + x509-cert for CSR generation
#   chacha20poly1305 — already pure-Rust (RustCrypto)
#   ed25519-dalek — already pure-Rust
#   x25519-dalek — already pure-Rust
#   blake3 — already pure-Rust
#
# Pure-Rust crates already in use: ed25519-dalek, x25519-dalek, chacha20poly1305,
# blake3, argon2, hkdf, sha2, hmac, aes-gcm, rand
#
# Remaining C dependencies via aws-lc-rs: TLS handshake (rustls), CSR (rcgen),
# certificate verification (webpki)
