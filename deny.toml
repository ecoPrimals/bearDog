# BearDog Cargo Deny Configuration (v2)
# Enforces dependency security, ecoBin purity, and quality standards

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RSA Marvin Attack (RUSTSEC-2023-0071): No upstream fix available.
    # RustCrypto RSA is the only pure-Rust RSA implementation.
    # BearDog uses Ed25519/X25519 as primary; RSA is legacy/interop only.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip = [
    # Transitive version splits — will resolve as upstream deps align.
    # Last audited: 2026-04-02 — removed 12 resolved skips.
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "linux-raw-sys" },
    { crate = "mio" },
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    { crate = "rustix" },
    { crate = "socket2" },
    { crate = "syn" },
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "winnow" },
]
deny = [
    { crate = "openssl", wrappers = [] },
    { crate = "openssl-sys", wrappers = [] },
    { crate = "ring", wrappers = [] },
    { crate = "aws-lc-rs", wrappers = [] },
    { crate = "aws-lc-sys", wrappers = [] },
    { crate = "native-tls", wrappers = [] },
    { crate = "libsodium-sys", wrappers = [] },
    { crate = "hidapi", wrappers = [] },
    { crate = "bindgen", wrappers = [] },
]
skip-tree = []

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
]
all-features = false
