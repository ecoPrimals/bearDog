# BearDog Cargo Deny Configuration (v2)
# Enforces dependency security, ecoBin purity, and quality standards

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RSA Marvin Attack (RUSTSEC-2023-0071): No upstream fix available.
    # RustCrypto RSA is the only pure-Rust RSA implementation.
    # BearDog uses Ed25519/X25519 as primary; RSA is legacy/interop only.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip = [
    # Transitive version splits — will resolve as upstream deps align.
    # Last audited: 2026-04-20 — removed 3 resolved single-version skips.
    { crate = "cpufeatures" },  # 0.2 (aes/sha2) + 0.3 (blake3)
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    { crate = "socket2" },  # 0.5 (local-ip-address) + 0.6 (tokio)
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "winnow" },
]
deny = [
    { crate = "async-trait" },
    { crate = "openssl", wrappers = [] },
    { crate = "openssl-sys", wrappers = [] },
    # ring is allowed ONLY as wrapped by rustls/tokio-rustls for TLS termination
    # (H2-10 sovereignty). Direct ring usage remains banned. rustls is the sole
    # TLS implementation and ring is its crypto backend (no pure-Rust WebPKI
    # provider exists that meets production TLS requirements).
    { crate = "ring", wrappers = ["rustls", "rustls-webpki"] },
    { crate = "aws-lc-rs", wrappers = [] },
    { crate = "aws-lc-sys", wrappers = [] },
    { crate = "native-tls", wrappers = [] },
    { crate = "libsodium-sys", wrappers = [] },
    { crate = "hidapi", wrappers = [] },
    { crate = "bindgen", wrappers = [] },
]
skip-tree = []

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
]
all-features = false
