# BearDog Cargo Deny Configuration
# Enforces dependency security, ecoBin purity, and quality standards

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-2.1",
    "LGPL-3.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "beardog"

[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "beardog-core"

[[licenses.exceptions]]
