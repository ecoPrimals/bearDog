
[package]
name = "beardog-sovereignty-examples"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "sovereignty_demo"
path = "sovereignty_demo.rs"

[[bin]]
name = "api_integration_demo"
path = "api_integration_demo.rs"

[[bin]]
name = "comprehensive_api_demo"
path = "comprehensive_api_demo.rs"

[[bin]]
name = "rpc_ecosystem_demo"
path = "rpc_ecosystem_demo.rs"

[[bin]]
name = "simple_rpc_test"
path = "simple_rpc_test.rs"

[[bin]]
name = "production_hsm_integration"
path = "production_hsm_integration.rs"

[[bin]]
name = "universal_hsm_demo"
path = "universal_hsm_demo.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
beardog-api = { path = "../crates/beardog-api" }
beardog-core = { path = "../crates/beardog-core" }
# beardog-config removed - use beardog-types::config::complete_unified
beardog-genetics = { path = "../crates/beardog-genetics" }
beardog-errors = { path = "../crates/beardog-errors" }
beardog-types = { path = "../crates/beardog-types" }
axum = "0.7"
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
