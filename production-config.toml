# BearDog Production Configuration
# This configuration is designed for production environments with
# proper secret management and security hardening

[app]
name = "BearDog-Production"
version = "1.0.0"
standalone_mode = false
environment = "production"
debug = false

[database]
# Database URL should be set via BEARDOG_DATABASE_URL environment variable
# Example: postgresql://beardog:${BEARDOG_DATABASE_PASSWORD}@db.production.local:5432/beardog
url = "postgresql://beardog@db.production.local:5432/beardog"
max_connections = 50
connection_timeout = 30
query_timeout = 30
ssl = true
ssl_cert_path = "/etc/ssl/certs/beardog-db.crt"
ssl_key_path = "/etc/ssl/private/beardog-db.key"
ssl_ca_path = "/etc/ssl/certs/ca.crt"

[network]
[network.http]
enabled = true
bind_address = "0.0.0.0:8443"
port = 8443
max_request_size = 16777216  # 16MB
keep_alive_timeout = 300

[network.https]
enabled = true
bind_address = "0.0.0.0:8443"
port = 8443
cert_path = "/etc/ssl/certs/beardog-api.crt"
key_path = "/etc/ssl/private/beardog-api.key"
cert_chain_path = "/etc/ssl/certs/beardog-chain.crt"
client_cert_verification = true

[network.rate_limiting]
enabled = true
requests_per_minute = 1000
burst_size = 100
window_seconds = 60

[network.cors]
enabled = true
allowed_origins = ["https://dashboard.production.company.com"]
allowed_methods = ["GET", "POST", "PUT", "DELETE"]
allowed_headers = ["Authorization", "Content-Type", "X-API-Key"]

[network.timeout]
request_timeout = 30
connect_timeout = 10
read_timeout = 30
write_timeout = 30

[security]
level = "High"
enable_hsm = true
token_expiration_seconds = 3600
max_failed_logins = 3
rate_limit_requests_per_minute = 1000
max_session_duration = "4h"

[security.password_policy]
min_length = 16
require_uppercase = true
require_lowercase = true
require_numbers = true
require_special = true
history_count = 12
max_age = "30d"

[security.mfa]
required = true
methods = ["TOTP", "WebAuthn"]

[security.session]
timeout = "1h"
cleanup_interval = "5m"
secure_cookies = true

[security.hsm]
enabled = true
provider = "PKCS11"
# HSM configuration details should be in /etc/beardog/hsm.conf

[encryption]
default_algorithm = "aes_256_gcm"
key_derivation_iterations = 100000
key_rotation_days = 30  # Monthly rotation in production
key_rotation_interval = "30d"
hsm_enabled = true

[encryption.hsm]
enabled = true
provider = "PKCS11"

[encryption.key_derivation.argon2]
memory_cost = 131072  # 128MB
time_cost = 4
parallelism = 8

[licensing]
# License key should be set via BEARDOG_LICENSE_KEY environment variable
key = ""
server_url = "https://license.beardog.security/api/v1"
check_interval = 7200  # 2 hours
validation_enabled = true

[threat_detection]
enabled = true
sensitivity_level = "high"
custom_rules_path = "/etc/beardog/threat-rules/"
model_update_hours = 6  # Update more frequently in production

[threat_detection.ml_models]
update_interval = "6h"

[threat_detection.behavioral_analysis]
enabled = true
analysis_window = "30m"
anomaly_threshold = 0.8  # Higher threshold for production

[compliance]
enabled_frameworks = ["GDPR", "HIPAA", "SOX", "PCI_DSS", "ISO_27001"]
audit_retention_days = 2555  # 7 years
notification_threshold = 0.9  # High threshold for compliance alerts

[audit]
enabled = true
retention_days = 2555
enable_alerts = true
log_level = "INFO"

[audit.storage]
storage_type = "database"
config = { 
    url = "postgresql://audit_user@audit-db.production.local:5432/beardog_audit",
    encryption = true,
    signing = true 
}

[monitoring]
enabled = true
level = "comprehensive"
interval = "60s"
retention = "30d"

[monitoring.logging]
level = "INFO"
format = "json"
output = "file"
file_path = "/var/log/beardog/beardog.log"
rotation = true
max_file_size = 100
max_files = 10

[monitoring.metrics]
enabled = true
backend = "prometheus"
interval = "60s"
retention = "30d"

[monitoring.health]
enabled = true
interval = "30s"
timeout = "5s"
endpoints = []

[monitoring.performance]
enabled = true
interval = "60s"
cpu_threshold = 80.0
memory_threshold = 85.0
disk_threshold = 90.0

[monitoring.alerting]
enabled = true
channels = [
    { name = "email", channel_type = "Email", config = { settings = { "smtp_server" = "smtp.company.com", "to" = "alerts@company.com" } } },
    { name = "slack", channel_type = "Slack", config = { settings = { "webhook_url" = "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK" } } }
]

[monitoring.alerting.thresholds]
cpu = 85.0
memory = 90.0
disk = 95.0
error_rate = 1.0
response_time = "5s"

[node_registry]
url = "https://registry.production.company.com"
registration_interval = 300
health_check_interval = 60
auto_register = true

[workflows]
enabled = true
default_approval_timeout_minutes = 30  # Shorter timeout for production
require_dual_approval = true
max_concurrent_workflows = 1000

[workflows.storage]
storage_type = "database"
config = { 
    url = "postgresql://workflow_user@workflow-db.production.local:5432/beardog_workflows",
    encryption = true 
}

[adapters]
[adapters.external_systems]
[adapters.external_systems.rust_ecosystem]
[adapters.external_systems.rust_ecosystem.nestgate]
enabled = true
endpoint = "https://nestgate.production.company.com:8443"
timeout_ms = 5000
tls = { enabled = true, cert_path = "/etc/ssl/certs/nestgate-client.crt", key_path = "/etc/ssl/private/nestgate-client.key" }
# Auth secret should be set via BEARDOG_NESTGATE_SECRET environment variable

[adapters.external_systems.rust_ecosystem.songbird]
enabled = true
endpoint = "https://songbird.production.company.com:8444"
timeout_ms = 3000
tls = { enabled = true, cert_path = "/etc/ssl/certs/songbird-client.crt", key_path = "/etc/ssl/private/songbird-client.key" }
# Auth secret should be set via BEARDOG_SONGBIRD_SECRET environment variable

# Secret Management Configuration
[secrets]
primary_source = "Environment"
cache_secrets = false  # No caching in production for security
cache_ttl_seconds = 0

[[secrets.fallback_sources]]
source_type = "File"
base_path = "/etc/beardog/secrets"
file_extension = "secret"
required_permissions = 0o600

# Production Feature Flags
[features]
# Core features
api_server = true
api_authentication = true
api_rate_limiting = true
openapi_docs = false  # Disable in production for security

# Security features
threat_detection = true
file_integrity_monitoring = true
rule_based_detection = true
alert_generation = true
ml_threat_detection = true

# Integration features
nestgate_adapter = true
songbird_adapter = true

# Advanced features
hsm_integration = true
distributed_consensus = true
genetic_spawning = true
compliance_monitoring = true

# Production optimizations
performance_monitoring = true
advanced_caching = true
connection_pooling = true
load_balancing = true

# Demo/Development features (disabled in production)
demo_mode = false
mock_services = false
debug_endpoints = false
test_data_generation = false 