# BearDog Timeout Configuration Example
# 
# This file demonstrates how to configure all timeout values in BearDog.
# All timeouts can also be overridden via environment variables.
#
# Created: November 7, 2025
# Status: Production-ready

[timeouts]
# Health check timeout in seconds
# Used by: Consul service discovery, service health monitoring
# Default: 5 seconds (industry standard)
# Environment: BEARDOG_HEALTH_CHECK_TIMEOUT_SECS
health_check_secs = 5

# HSM operation timeout in seconds
# Used by: HSM cloud metadata discovery, general HSM operations
# Default: 2 seconds (typical HSM operation latency)
# Environment: BEARDOG_HSM_OPERATION_TIMEOUT_SECS
hsm_operation_secs = 2

# HSM probe timeout in milliseconds
# Used by: HSM network service discovery, quick availability checks
# Default: 500 milliseconds (fast probe for responsiveness)
# Environment: BEARDOG_HSM_PROBE_TIMEOUT_MILLIS
hsm_probe_millis = 500

# Service discovery operation timeout in seconds
# Used by: Service discovery protocols, network scans
# Default: 10 seconds (allows for network latency and retries)
# Environment: BEARDOG_DISCOVERY_TIMEOUT_SECS
discovery_operation_secs = 10

# Example: Development Configuration (faster timeouts)
# [timeouts]
# health_check_secs = 2
# hsm_operation_secs = 1
# hsm_probe_millis = 200
# discovery_operation_secs = 5

# Example: Production Configuration (more conservative)
# [timeouts]
# health_check_secs = 10
# hsm_operation_secs = 5
# hsm_probe_millis = 1000
# discovery_operation_secs = 30

# Example: High-Performance Configuration (aggressive timeouts)
# [timeouts]
# health_check_secs = 3
# hsm_operation_secs = 1
# hsm_probe_millis = 300
# discovery_operation_secs = 5

# Validation Ranges:
# - health_check_secs: 1-30 seconds
# - hsm_operation_secs: 1-10 seconds
# - hsm_probe_millis: 100-5000 milliseconds
# - discovery_operation_secs: 1-60 seconds
#
# Values outside these ranges will be rejected during configuration validation.

# Environment Variable Override Examples:
#
# # Set health check timeout to 15 seconds
# export BEARDOG_HEALTH_CHECK_TIMEOUT_SECS=15
#
# # Set HSM operation timeout to 3 seconds
# export BEARDOG_HSM_OPERATION_TIMEOUT_SECS=3
#
# # Set HSM probe timeout to 1 second
# export BEARDOG_HSM_PROBE_TIMEOUT_MILLIS=1000
#
# # Set discovery timeout to 20 seconds
# export BEARDOG_DISCOVERY_TIMEOUT_SECS=20

# Usage:
#
# 1. Copy this file to your config directory:
#    cp beardog-timeouts-example.toml ~/.config/beardog/config.toml
#
# 2. Edit the values as needed for your environment
#
# 3. BearDog will automatically load the configuration:
#    let config = BearDogConfig::load()?;
#
# 4. Or load from a specific file:
#    let config = BearDogConfig::from_file("path/to/config.toml")?;
#
# 5. Or override via environment variables (highest priority):
#    export BEARDOG_HEALTH_CHECK_TIMEOUT_SECS=10
#    cargo run

# Integration with Full Configuration:
#
# This timeout configuration can be combined with other configuration sections:
#
# [network]
# api_host = "0.0.0.0"
# api_port = 8080
#
# [hsm]
# auto_detect = true
# prefer_hardware = true
#
# [timeouts]
# health_check_secs = 5
# hsm_operation_secs = 2
# # ... etc

# Notes:
# - All timeouts are optional; sensible defaults will be used if not specified
# - Environment variables always take precedence over config file values
# - Timeouts are validated when the configuration is loaded
# - Invalid timeout values will cause configuration loading to fail with a clear error message

