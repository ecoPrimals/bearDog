# BearDog Production Configuration
# NOTE: HTTP/REST sections below ([api], [api.auth], [api.tls]) are from the
# pre-UniBin era.  The primary transport is now Unix socket JSON-RPC.
# Retained as a configuration reference / fossil record.
# Optimized for enterprise deployment with security and performance

[api]
bind_address = "0.0.0.0:8080"
tls_bind_address = "0.0.0.0:8443"
enable_cors = false
request_timeout_ms = 30000
max_request_size = "16MB"
rate_limit_requests_per_minute = 1000

[api.auth]
auth_method = "Ed25519"
session_timeout_hours = 24
require_mfa = true
password_policy = "strict"

[api.tls]
cert_path = "/app/certs/server.crt"
key_path = "/app/certs/server.key"
min_tls_version = "1.3"
cipher_suites = ["TLS_AES_256_GCM_SHA384", "TLS_CHACHA20_POLY1305_SHA256"]

[database]
url = "${BEARDOG_DATABASE_URL}"
max_connections = 100
connection_timeout_secs = 30
idle_timeout_secs = 600
enable_ssl = true
ssl_mode = "require"

[security]
enable_hsm = true
hsm_provider = "auto"
enable_audit_logging = true
audit_log_path = "/app/logs/audit.log"
enable_rate_limiting = true
enable_ddos_protection = true

[security.encryption]
default_algorithm = "AES-256-GCM"
key_rotation_hours = 168  # Weekly
enable_quantum_resistant = true

[monitoring]
enable_metrics = true
metrics_bind_address = "0.0.0.0:9190"
enable_health_checks = true
health_check_interval_secs = 30
enable_performance_tracking = true

[monitoring.logging]
level = "info"
format = "json"
output = "file"
file_path = "/app/logs/beardog.log"
max_file_size = "100MB"
max_files = 10
enable_structured_logging = true

[performance]
enable_zero_copy_optimizations = true
memory_pool_size = 512
string_cache_size = 1024
enable_simd_acceleration = true
worker_threads = 0  # Auto-detect CPU cores
max_blocking_threads = 512

[compliance]
enabled = true
enabled_standards = ["GDPR", "HIPAA", "SOC2", "ISO27001"]
data_retention_days = 2555  # 7 years
enable_right_to_be_forgotten = true
enable_data_portability = true

[sovereignty]
enable_sovereignty_monitoring = true
enable_human_dignity_protection = true
enable_anti_surveillance_measures = true
corporate_access_requires_payment = true
enable_consent_management = true

[threat_detection]
enabled = true
enable_realtime_analysis = true
threat_score_threshold = 0.7
enable_behavioral_analysis = true
enable_anomaly_detection = true

[genetics]
enabled = true
enable_entropy_optimization = true
enable_performance_evolution = true
mutation_rate = 0.01
population_size = 100

# Genetic crypto features (Phase 2)
entropy_collection_enabled = true
genetic_spawning_enabled = true
ecosystem_evolution_enabled = true
human_entropy_validation = true
authorization_genetics_enabled = true
enable_genetic_key_evolution = true      # Enable genetic key evolution
genetic_key_rotation_enabled = true       # Enable automatic key rotation

[workflows]
enabled = true
max_concurrent_workflows = 1000
workflow_timeout_secs = 3600
enable_workflow_persistence = true

[adapters]
enable_universal_discovery = true
discovery_timeout_secs = 30
enable_capability_caching = true
cache_ttl_secs = 300

[adapters.external_systems]
timeout_secs = 60
max_retries = 3
retry_delay_ms = 1000
enable_circuit_breaker = true

# Environment-specific overrides
[production]
debug_mode = false
enable_profiling = false
strict_validation = true
paranoid_security = true 