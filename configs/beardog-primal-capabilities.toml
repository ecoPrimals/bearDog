# BearDog primal self-knowledge & capability discovery
#
# Parsed by `beardog_discovery::DiscoveryConfig::from_file` — only tables/keys that
# match that schema are allowed below. Every scalar below is a **documented default**:
# production and multi-tenant deployments should prefer `BEARDOG_*` (and related env vars)
# so bind addresses, ports, and discovery labels come from the runtime, not this file alone.
#
# =============================================================================
# RUNTIME OVERRIDES — BEARDOG_* (see `crates/beardog-config`, `beardog-capabilities`)
# =============================================================================
# Network (aligns with `beardog_config::domains::network_*` and `network_ports`):
#   BEARDOG_BIND_ADDRESS — bind host for APIs/TLS (fallback `DEFAULT_BIND_ADDRESS` / operator policy)
#   BEARDOG_WILDCARD_IPV4 — literal “all interfaces” when you must pin 0.0.0.0 explicitly
#   BEARDOG_HTTPS_PORT — TLS API port (default `DEFAULT_HTTPS_PORT` = 8443 in `network_ports`)
#   BEARDOG_PORT — higher-level port override chain where wired (CLI / self-knowledge)
#   BEARDOG_API_HOST, BEARDOG_API_PORT, BEARDOG_EXTERNAL_HOST — URLs and announcements
# Capability discovery / mDNS (aligns with `beardog-capabilities` + `beardog-discovery`):
#   BEARDOG_CAPABILITY_MDNS_SERVICE — full DNS-SD type (`_<cap>._tcp`); see `metadata::ENV_CAPABILITY_MDNS_SERVICE`
#   BEARDOG_CAPABILITY_MDNS_INSTANCE — SRV instance label (not a peer primal product name)
#   BEARDOG_CAPABILITY_DISCOVERY_TTL — announcement TTL when wired to registry
#   BEARDOG_NEURAL_REGISTRATION_INSTANCE — Neural API registration id (default: capability role + NODE_ID)
#   PRIMAL_TYPE / BEARDOG_PRIMAL_TYPE — capability role string for default registration label
# IPC / registry:
#   IPC_SOCKET, DISCOVERY_SOCKET — Unix paths for IPC discovery (`beardog-ipc`)
#   BEARDOG_DEV_DISCOVERY_SOCKET — dev fallback socket path (or `discovery_socket_dev_fallback_path()` under temp dir)
#   BEARDOG_IPC_RESOLVE_TARGET_PARAM_KEY — JSON-RPC `ipc.resolve` params field (default `primal`; legacy wire name)
# Tunnel / BTSP (`beardog-config::domains::btsp`):
#   BEARDOG_BTSP_BIRDSONG_KEY_LABEL — HSM key label for BirdSong master
#   BEARDOG_BTSP_LINEAGE_ROOT_PREFIX, BEARDOG_BTSP_LINEAGE_MAX_DEPTH — session lineage hints
#   BEARDOG_TUNNEL_KEY_STORAGE_PATH — tunnel key storage path
#   BEARDOG_GAMING_ANTI_CHEAT_CAPABILITY — anti-cheat capability id (empty = discover at runtime)
# Observability:
#   BEARDOG_PROFILING_PORT — profiling HTTP (`DEFAULT_PROFILING_PORT` in `network_ports`)
#   BEARDOG_LOG_LEVEL — tunnel monitoring log filter (see `MonitoringConfig::from_env`)
# Lineage placeholders:
#   BEARDOG_FAMILY_UNKNOWN_LABEL — when FAMILY_ID / BEARDOG_FAMILY_ID unset (BTSP)
#
# This file does not expand ${ENV}; set environment variables in your supervisor or `.env`.

[primal_self]
# env_override: sovereign instance id for this deployment (file template; not used for peer routing)
primal_id = "beardog"
# env_override: PRIMAL_TYPE, BEARDOG_PRIMAL_TYPE — capability role for defaults (e.g. neural registration label)
primal_type = "security"
# env_override: version often injected by CI / package manifest
version = "0.9.0"
# Human-facing label only; peers discover via self_capabilities + mDNS, not display_name
display_name = "BearDog Security Primal"

# Capabilities this primal offers — consumers discover by these names, not by display_name.
self_capabilities = [
    "security",
    "encryption",
    "key_management",
    "audit",
    "hsm_integration",
    "genetic_keys",
    "btsp_protocol",
    "lineage_tracking",
    "entropy_mixing"
]

[primal_self.endpoint]
# Documented template only — must match runtime env for real listeners:
#   host ↔ BEARDOG_BIND_ADDRESS or BEARDOG_WILDCARD_IPV4 (see `network_addresses::WILDCARD_IPV4`)
#   port ↔ BEARDOG_HTTPS_PORT (default `DEFAULT_HTTPS_PORT` in `beardog_config::network_ports`)
# env_override: BEARDOG_BIND_ADDRESS (fallback bind in `NetworkAddressesConfig`)
host = "0.0.0.0"
# env_override: BEARDOG_HTTPS_PORT; chain: BEARDOG_PORT where integrated
port = 8443
# env_override: TLS termination policy is deployment-specific; scheme here is the advertised API surface
scheme = "https"
# env_override: BEARDOG_CAPABILITY_HTTP_PATH for HTTP capability manifest path segment
path_prefix = "/api/v1"

[primal_self.announcement]
enabled = true
methods = ["mdns", "environment", "service_registry"]
announcement_interval_secs = 60
# env_override: BEARDOG_CAPABILITY_DISCOVERY_TTL (when using capability registry advertisement)
ttl_secs = 300

# Ecosystem mDNS: `_{lowercase_capability}._tcp.local.` (see `beardog-discovery::MdnsDiscovery::capability_to_service_type`).
# Optional aggregate type for capability HTTP manifests: `_beardog-cap._tcp.local.` (`beardog-capabilities::metadata`).
[primal_self.announcement.mdns]
enabled = true
# DNS-SD instance label — capability-oriented default; override with BEARDOG_CAPABILITY_MDNS_INSTANCE
service_name = "security-capability"
# Primary browse type for this primal_type=security; override with BEARDOG_CAPABILITY_MDNS_SERVICE
service_type = "_security._tcp.local."

[required_capabilities.orchestration]
required = false
preferred = true
min_version = "1.0"
features = ["service_discovery", "load_balancing", "coordination"]
fallback = "standalone"

[required_capabilities.tunnel_coordination]
required = false
preferred = true
features = ["peer_discovery", "nat_traversal", "relay"]
fallback = "direct"

[required_capabilities.storage]
required = false
preferred = false
features = ["encrypted_storage", "versioning", "backup"]
fallback = "local"

[required_capabilities.compute]
required = false
preferred = false
features = ["gpu_acceleration", "parallel_processing"]
fallback = "local"

[required_capabilities.ai]
required = false
preferred = false
features = ["anomaly_detection", "threat_analysis"]
fallback = "rule_based"

[discovery]
methods = ["environment", "mdns", "dns_sd", "service_registry", "network_scan"]
discovery_timeout_secs = 10
discovery_interval_secs = 300
cache_ttl_secs = 600

[discovery.environment]
enabled = true
capability_pattern = "CAPABILITY_{}_ENDPOINT"
primal_pattern = "PRIMAL_{}_ENDPOINT"

# Types use `._tcp.local.` suffix per `beardog-discovery` (capability slug = browse type without product names).
[discovery.mdns]
enabled = true
timeout_secs = 5
service_types = [
    "_orchestration._tcp.local.",
    "_coordination._tcp.local.",
    "_tunnel_coordination._tcp.local.",
    "_storage._tcp.local.",
    "_compute._tcp.local.",
    "_ai._tcp.local.",
    "_security._tcp.local.",
    "_beardog-cap._tcp.local."
]

[service_selection]
strategy = "qos_based"

[service_selection.qos_weights]
latency = 0.4
throughput = 0.2
availability = 0.3
reliability = 0.1

# ===============================================================================
# NOTES (documentation only — not separate TOML tables)
# ===============================================================================
# Environment announcement pattern: any primal may set PRIMAL_<ID>_ENDPOINT and
# CAPABILITY_<ROLE>_ENDPOINT; BearDog discovers orchestration/storage/etc. by
# capability, not by product name.
# Health / metrics / trust anchors: configure via deployment env and
# `beardog-config` — do not hardcode peer primals in this file.
