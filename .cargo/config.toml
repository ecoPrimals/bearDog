# Cargo Build Optimization Configuration
# Optimized for 24-core system

[build]
# Use all 24 cores for parallel compilation
jobs = 24

# Enable pipelined compilation (faster for large workspaces)
pipelining = true

# Fast linker (install `mold` and `clang` for 30-50% faster linking):
#   sudo apt install mold clang
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Incremental compilation settings
[profile.dev]
# Already set in Cargo.toml, but ensure incremental is on
incremental = true

# Split debuginfo for faster linking
split-debuginfo = "unpacked"

[net]
# Increase git fetch parallelism
git-fetch-with-cli = false

# Note: git-fetch-parallelism was removed - Cargo now auto-detects optimal parallelism
# Dependencies will fetch in parallel automatically

[term]
verbose = false
quiet = false

# Android NDK (aarch64): do not commit machine-specific paths.
# Set the linker via environment variable before building for this target:
#   export ANDROID_NDK_HOME="$HOME/android-dev/android-ndk-r25c"
#   export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
# Cargo reads CARGO_TARGET_<triple>_LINKER automatically; no hardcoded path needed here.
