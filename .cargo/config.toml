# BearDog Cross-Compilation Configuration
# TRUE ecoBin v2.0 → genomeBin Evolution
# Based on biomeOS reference implementation
# Created: January 30, 2026

[build]
# Use all 24 cores for parallel compilation
jobs = 24

# Enable pipelined compilation (faster for large workspaces)
pipelining = true

# Default to x86_64 musl for maximum portability
target = "x86_64-unknown-linux-musl"

# ============================================================================
# CROSS-COMPILATION TARGETS (genomeBin Support)
# ============================================================================

# ARM64 Linux (musl for static linking)
[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static",
    "-C", "link-arg=-lc"
]

# ARM64 Android (for Pixel 8a / GrapheneOS)
[target.aarch64-linux-android]
linker = "aarch64-linux-android-ld"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static"
]

# x86_64 Linux (musl for static linking - ecoBin v2.0 standard)
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static"
]

# ARM64 macOS (Apple Silicon)
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-dead_strip"
]

# RISC-V (future expansion)
[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"

# ============================================================================
# BUILD PROFILES (genomeBin Optimization)
# ============================================================================

# Incremental compilation settings
[profile.dev]
# Already set in Cargo.toml, but ensure incremental is on
incremental = true

# Split debuginfo for faster linking
split-debuginfo = "unpacked"

[net]
# Increase git fetch parallelism
git-fetch-with-cli = false

# Note: git-fetch-parallelism was removed - Cargo now auto-detects optimal parallelism
# Dependencies will fetch in parallel automatically

[term]
verbose = false
quiet = false

