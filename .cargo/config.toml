# Cargo Build Optimization Configuration
# Optimized for 24-core system

[build]
# Use all 24 cores for parallel compilation
jobs = 24

# Enable pipelined compilation (faster for large workspaces)
pipelining = true

# [target.x86_64-unknown-linux-gnu]
# Uncomment and install fast linker for 30-50% faster linking:
# 
# Option 1: lld (recommended)
# sudo apt install lld clang
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
#
# Option 2: mold (fastest, but newer)
# sudo apt install mold
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Incremental compilation settings
[profile.dev]
# Already set in Cargo.toml, but ensure incremental is on
incremental = true

# Split debuginfo for faster linking
split-debuginfo = "unpacked"

[net]
# Increase git fetch parallelism
git-fetch-with-cli = false

# Note: git-fetch-parallelism was removed - Cargo now auto-detects optimal parallelism
# Dependencies will fetch in parallel automatically

[term]
verbose = false
quiet = false

# Android NDK (aarch64): do not commit machine-specific paths. Set ANDROID_NDK_HOME to the NDK root
# (e.g. export ANDROID_NDK_HOME="$HOME/android-dev/android-ndk-r25c") before building for this target,
# or put a local-only override in `.cargo/config.local.toml` (merge layer; keep that file out of git).
# Cargo expands ${VAR} in config values; see https://doc.rust-lang.org/cargo/reference/config.html
[target.aarch64-linux-android]
linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
