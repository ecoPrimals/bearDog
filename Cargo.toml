[workspace]
resolver = "2"
members = [
    "crates/beardog-errors",
    "crates/beardog-types", 
    "crates/beardog-traits",
    "crates/beardog-utils",
    "crates/beardog-security",
    "crates/beardog-auth",
    "crates/beardog-compliance",
    "crates/beardog-monitoring", 
    "crates/beardog-genetics",
    "crates/beardog-adapters",
    "crates/beardog-core",
    "crates/beardog-deploy",
    "crates/beardog-cli",
    "crates/beardog-production",
    "crates/beardog-node-registry",
    "crates/beardog-threat",
    "crates/beardog-workflows",
    "crates/beardog-tunnel",
    "benchmarks",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Enterprise-grade security ecosystem with unified architecture and zero technical debt"
homepage = "https://github.com/your-org/beardog"
repository = "https://github.com/your-org/beardog"
authors = ["BearDog Security Team"]
keywords = ["security", "hsm", "threat-detection", "compliance", "workflow"]
categories = ["cryptography", "authentication", "web-programming", "network-programming"]
rust-version = "1.70"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async traits (legacy support)
async-trait = "0.1"

# Time and UUIDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Cryptography
ring = "0.16"
aes-gcm = "0.10"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"
base64 = "0.21"
hex = "0.4"
rustls = "0.21"
argon2 = "0.5"
zeroize = "1.6"

# HTTP and networking
reqwest = { version = "0.11", features = ["json", "stream"] }
hyper = { version = "0.14", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "timeout"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
redis = { version = "0.23", features = ["tokio-comp"] }

# Configuration and CLI
clap = { version = "4.0", features = ["derive"] }
config = "0.13"

# Networking
ipnet = "2.9"

# Testing
mockall = "0.11"

# Internal crates - unified and modernized
beardog-errors = { path = "crates/beardog-errors" }
beardog-types = { path = "crates/beardog-types" }
beardog-traits = { path = "crates/beardog-traits" }
beardog-utils = { path = "crates/beardog-utils" }
beardog-security = { path = "crates/beardog-security" }
beardog-auth = { path = "crates/beardog-auth" }
beardog-compliance = { path = "crates/beardog-compliance" }
beardog-monitoring = { path = "crates/beardog-monitoring" }
beardog-genetics = { path = "crates/beardog-genetics" }
beardog-adapters = { path = "crates/beardog-adapters" }
beardog-core = { path = "crates/beardog-core" }
beardog-deploy = { path = "crates/beardog-deploy" }
beardog-cli = { path = "crates/beardog-cli" }
beardog-production = { path = "crates/beardog-production" }
beardog-node-registry = { path = "crates/beardog-node-registry" }
beardog-threat = { path = "crates/beardog-threat" }
beardog-workflows = { path = "crates/beardog-workflows" }
beardog-tunnel = { path = "crates/beardog-tunnel" }

[workspace.metadata.docs.rs]
features = ["hsm", "ml-threat-detection", "genetic-spawning", "compliance", "federation"]
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = 0

[profile.bench]
debug = false
lto = true



 