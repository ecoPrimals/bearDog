[workspace]
resolver = "2"
members = [
    "crates/*",
    "benchmarks",
    "showcase/05-mixed-entropy",
]
exclude = [
    "android",
    "ecosystem-bindings",
    "crates/beardog-crypto",
    "crates/beardog-networking",
    "crates/beardog",
    "showcase/00-local-primal/01-hello-beardog",
    "showcase/00-local-primal/02-hsm-discovery",
    "showcase/00-local-primal/03-key-constraints",
    "showcase/00-local-primal/04-entropy-mixing",
    "showcase/00-local-primal/05-key-lineage",
    "showcase/00-local-primal/06-btsp-tunnel",
    "showcase/02-ecosystem-integration/01-songbird-btsp",
    "showcase/02-ecosystem-integration/02-nestgate-encryption",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["BearDog Team"]
license = "Apache-2.0"
repository = "https://github.com/ecoPrimals/beardog"
homepage = "https://beardog.dev"
documentation = "https://docs.beardog.dev"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Transition period - BearDogResult is being migrated
deprecated = "allow"

[workspace.lints.clippy]
# Pedantic allowlist - to be addressed in polish phase (Week 3-4)
struct_excessive_bools = { level = "allow", priority = 1 }  # Refactor to enums (tracked)
unused_async = { level = "allow", priority = 1 }  # Async infrastructure, may be used later
trivially_copy_pass_by_ref = { level = "allow", priority = 1 }  # Optimization pass later
cast_possible_truncation = { level = "allow", priority = 1 }  # Address with proper validation
cast_precision_loss = { level = "allow", priority = 1 }  # Address with proper validation
unnecessary_wraps = { level = "allow", priority = 1 }  # API consistency over optimization
items_after_statements = { level = "allow", priority = 1 }  # Style preference
if_same_then_else = { level = "allow", priority = 1 }  # May have different semantics

# Additional pedantic allows for test code patterns
field_reassign_with_default = { level = "allow", priority = 1 }  # Common test pattern
default_trait_access = { level = "allow", priority = 1 }  # Style consistency
needless_borrows_for_generic_args = { level = "allow", priority = 1 }  # Will fix in cleanup
useless_format = { level = "allow", priority = 1 }  # Minor optimization
print_literal = { level = "allow", priority = 1 }  # Allowed in CLIs
vec_init_then_push = { level = "allow", priority = 1 }  # Performance is acceptable for clarity
unnecessary_literal_unwrap = { level = "allow", priority = 1 }  # Test code pattern
assertions_on_constants = { level = "allow", priority = 1 }  # Test scaffolding
# doc_tests = { level = "allow", priority = 1 }  # NOTE: This lint doesn't exist in clippy - removed Dec 10, 2025

# Lint groups (priority 0, lower than individual lints)
all = "warn"
pedantic = "warn"
perf = "warn"

# Disabled for transition period - will be re-enabled in Week 3
expect_used = { level = "allow", priority = 2 }  # Tests only
unwrap_used = { level = "allow", priority = 2 }  # Tests only

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async runtime
async-trait = "0.1"
futures = "0.3"

# Cryptography (100% Pure Rust!)
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
blake3 = { version = "1.5", features = ["pure"] }  # Pure Rust (no C assembly) for universal portability
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
lettre = "0.11"
cryptoki = "0.6"
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }

# Networking
quinn = "0.11"
rustls = { version = "0.23", features = ["dangerous_configuration"] }
rustls-pemfile = "2.1"
tokio-rustls = "0.26"

# Database
sled = "0.34"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# HTTP/API REMOVED - BearDog is crypto-only, delegates HTTP to Songbird via Tower Atomic!
# hyper removed - integration tests use Tower Atomic instead
# reqwest removed - use Songbird via Tower Atomic for external HTTP
# axum, tower, tower-http removed - BTSP now uses Unix socket JSON-RPC
tokio-tungstenite = "0.24"  # WebSocket for BTSP tunnel transport only
serde_yaml = "0.9"

# Serialization
bincode = "1.3"
postcard = { version = "1.0", features = ["alloc"] }
rmp-serde = "1.1"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
hidapi = "2.6"  # For FIDO2/hardware security token support
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
bytes = "1.5"
parking_lot = "0.12"
base64 = "0.22"
hex = "0.4"
bcrypt = "0.15"
# JWT: Implemented using RustCrypto (hmac + sha2 + base64) - 100% Pure Rust!

# Configuration
config = "0.14"
figment = { version = "0.10", features = ["toml", "env"] }

# Monitoring/Metrics
prometheus = "0.13"
opentelemetry = "0.22"
opentelemetry-prometheus = "0.15"
metrics = "0.21"

# Error handling
color-eyre = "0.6"

# Testing
proptest = "1.4"
mockall = "0.12"
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# BearDog internal crates
beardog-types = { path = "crates/beardog-types" }
beardog-errors = { path = "crates/beardog-errors" }
beardog-core = { path = "crates/beardog-core" }
beardog-config = { path = "crates/beardog-config" }
beardog-tunnel = { path = "crates/beardog-tunnel" }
beardog-auth = { path = "crates/beardog-auth" }
beardog-genetics = { path = "crates/beardog-genetics" }
beardog-adapters = { path = "crates/beardog-adapters" }
beardog-monitoring = { path = "crates/beardog-monitoring" }
beardog-ipc = { path = "crates/beardog-ipc" }
beardog-security = { path = "crates/beardog-security" }
beardog-threat = { path = "crates/beardog-threat" }
beardog-traits = { path = "crates/beardog-traits" }
beardog-utils = { path = "crates/beardog-utils" }
beardog-workflows = { path = "crates/beardog-workflows" }
beardog-compliance = { path = "crates/beardog-compliance" }
beardog-cli = { path = "crates/beardog-cli" }
beardog-deploy = { path = "crates/beardog-deploy" }
beardog-production = { path = "crates/beardog-production" }
beardog-node-registry = { path = "crates/beardog-node-registry" }

[package]
name = "beardog"
description = "Zero-trust, sovereign cryptographic workflow orchestrator with hardware security module integration"
keywords = ["cryptography", "hsm", "security", "workflow", "sovereignty"]
categories = ["cryptography", "authentication", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Binary target temporarily disabled - needs proper main.rs
# [[bin]]
# name = "beardog-server"
# path = "src/main.rs"

[dependencies]
beardog-core = { workspace = true }
beardog-config = { workspace = true }
beardog-types = { workspace = true }
beardog-errors = { workspace = true }
beardog-tunnel = { workspace = true }
beardog-auth = { workspace = true }
beardog-genetics = { workspace = true }
beardog-monitoring = { workspace = true }
beardog-ipc = { path = "crates/beardog-ipc" }
hostname = "0.3"
beardog-security = { workspace = true }
beardog-traits = { workspace = true }
beardog-cli = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# Optional dependencies for examples
hidapi = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
serial_test = "3.2"
beardog-adapters = { path = "crates/beardog-adapters" }
beardog-capabilities = { path = "crates/beardog-capabilities" }
futures = { workspace = true }
beardog-genetics = { path = "crates/beardog-genetics" }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }  # For E2E tests
tempfile = "3.8"  # For creating temporary Unix sockets in tests
uuid = { workspace = true }  # For chaos tests
# reqwest removed - integration tests use Songbird via Tower Atomic instead

[[test]]
name = "chaos"
path = "tests/chaos/mod.rs"
harness = true

[[test]]
name = "fault_injection"
path = "tests/fault_injection/mod.rs"
harness = true

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
debug-assertions = true
overflow-checks = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = true
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
# BTSP evolved to Unix socket JSON-RPC! HTTP API deprecated.
# default = ["btsp-api"]  # DEPRECATED: BTSP now uses Unix sockets
default = []
# FIDO2 support - currently in Phase 2 development
fido2 = ["beardog-security/fido2", "dep:hidapi"]
# mDNS discovery support for primal-to-primal runtime discovery
mdns = ["beardog-core/mdns"]
# BTSP HTTP API DEPRECATED - evolved to Unix socket JSON-RPC!
# btsp-api = ["beardog-tunnel/btsp-api"]  # DEPRECATED: Use Unix socket BTSP instead
full = ["fido2", "mdns"]  # Removed btsp-api - BTSP now pure Unix sockets
