[workspace]
resolver = "2"
members = [
    "crates/*",
    "benchmarks",
    "showcase/05-mixed-entropy",
]
exclude = [
    "crates/beardog",
    "showcase/00-local-primal/01-hello-beardog",
    "showcase/00-local-primal/02-hsm-discovery",
    "showcase/00-local-primal/03-key-constraints",
    "showcase/00-local-primal/04-entropy-mixing",
    "showcase/00-local-primal/05-key-lineage",
    "showcase/00-local-primal/06-btsp-tunnel",
    "showcase/02-ecosystem-integration/01-songbird-btsp",
    "showcase/02-ecosystem-integration/02-nestgate-encryption",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.93.0"
authors = ["BearDog Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/beardog"
homepage = "https://beardog.dev"
documentation = "https://docs.beardog.dev"

[workspace.lints.rust]
# `forbid` at workspace level — cannot be relaxed by any crate.
unsafe_code = "forbid"
missing_docs = "warn"
deprecated = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
perf = "warn"
nursery = "warn"

# ── Genuinely noisy / opinionated — silenced with justification ──────────────
# Trait impls often require `self` / `async` even when unused by the impl.
unused_async = { level = "allow", priority = 1 }
unused_self = { level = "allow", priority = 1 }
# Some trait method wrappers must return Result even on infallible paths.
unnecessary_wraps = { level = "allow", priority = 1 }
# Explicit naming (e.g. `BearDogError` inside `beardog_errors`) aids grep-ability.
module_name_repetitions = { level = "allow", priority = 1 }
# `#[must_use]` on every pure function is extremely noisy for a large codebase.
must_use_candidate = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
# Not all PartialEq types satisfy Eq (floats, etc.).
derive_partial_eq_without_eq = { level = "allow", priority = 1 }
# `significant_drop` lints have high false-positive rates in async code.
significant_drop_tightening = { level = "allow", priority = 1 }
significant_drop_in_scrutinee = { level = "allow", priority = 1 }
# Async futures in this codebase often hold non-Send types (design choice).
future_not_send = { level = "allow", priority = 1 }
# Struct fields may intentionally share prefixes with the struct name.
struct_field_names = { level = "allow", priority = 1 }
# Debug impls intentionally omit sensitive fields.
missing_fields_in_debug = { level = "allow", priority = 1 }
# Style preferences that don't affect correctness:
items_after_statements = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
match_same_arms = { level = "allow", priority = 1 }
ref_option = { level = "allow", priority = 1 }
redundant_pub_crate = { level = "allow", priority = 1 }
no_effect_underscore_binding = { level = "allow", priority = 1 }
used_underscore_binding = { level = "allow", priority = 1 }
used_underscore_items = { level = "allow", priority = 1 }
empty_line_after_doc_comments = { level = "allow", priority = 1 }
empty_line_after_outer_attr = { level = "allow", priority = 1 }
duplicated_attributes = { level = "allow", priority = 1 }
# `&bool` / `&u8` vs by-value: marginal perf difference, noisy on public APIs.
trivially_copy_pass_by_ref = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
# Many functions could be const but call non-const methods or are async-adjacent.
missing_const_for_fn = { level = "allow", priority = 1 }
# Passing by value is sometimes intentional for API ergonomics / ownership semantics.
needless_pass_by_value = { level = "allow", priority = 1 }
# `type_complexity` triggers on deeply nested generic types that are readable as-is.
type_complexity = { level = "allow", priority = 1 }
# `too_many_lines` — enforced via 1000-line file limit + PR review, not per-function.
too_many_lines = { level = "allow", priority = 1 }
# `cognitive_complexity` — tracked via crate-level metrics, not per-function lint.
cognitive_complexity = { level = "allow", priority = 1 }
# `inline_always` — specific hot paths are profiled and intentionally force-inlined.
inline_always = { level = "allow", priority = 1 }
# Wildcard imports used in prelude patterns and conditional compilation paths.
wildcard_imports = { level = "allow", priority = 1 }
# `Default::default()` vs `Type::default()` — both are clear; migrate incrementally.
default_trait_access = { level = "allow", priority = 1 }
field_reassign_with_default = { level = "allow", priority = 1 }
# `&mut` on params not mutated: common in trait impls where the signature requires it.
needless_pass_by_ref_mut = { level = "allow", priority = 1 }
# Match arms using `_` for single remaining variant — sometimes clearer than naming it.
match_wildcard_for_single_variants = { level = "allow", priority = 1 }

# ── Pedantic doc lints — kept allow while doc coverage ramps up ──────────────
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
doc_link_with_quotes = { level = "allow", priority = 1 }
doc_lazy_continuation = { level = "allow", priority = 1 }
too_long_first_doc_paragraph = { level = "allow", priority = 1 }
empty_docs = { level = "allow", priority = 1 }

# ── Cast safety — workspace allow remains required (2026-03 audit: removing any
#    of these trips `cargo clippy --workspace --all-features -- -D warnings`).
#    Prefer per-site #[expect(clippy::cast_*, reason = "...")] for new code. ───
cast_possible_truncation = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_lossless = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }

# ── Unwrap / expect — allowed in test code only. Library code must use
#    Result<T, E>.  Migrate violations to per-site #[expect] with reason. ─────
expect_used = { level = "allow", priority = 2 }
unwrap_used = { level = "allow", priority = 2 }

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serial_test = "3.0"
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async runtime
async-trait = "0.1"
futures = "0.3"

# Cryptography (100% Pure Rust!)
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
blake3 = { version = "1.5", features = ["pure"] }  # Pure Rust (no C assembly) for universal portability
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
sha1 = "0.10"  # Legacy hashing (Git compatibility) - Phase 7
# REMOVED: lettre = "0.11"  # Email - unused
# REMOVED: cryptoki = "0.6"  # PKCS#11 FFI - unused (have our own pkcs11_provider.rs)
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }  # ECDSA P-384 (Phase 2)
ed448-goldilocks = "0.9"  # Ed448 signatures (Phase 3, deferred)
scrypt = "0.11"           # Memory-hard KDF - stable version (evolved from RC)
# DEFERRED Phase 7: AES legacy modes - RustCrypto RC version conflicts (like P-521/Ed448)
# aes = "0.9.0-rc.2"        # AES cipher (for CBC/CTR/XTS modes)
# cipher = "0.5.0-rc.5"     # Cipher traits (for AES modes)
# cbc = "0.2.0-rc.2"        # AES-CBC mode (TLS 1.2)
# ctr = "0.10.0-rc.2"       # AES-CTR mode (streaming)
# xts-mode = "0.5.1"        # AES-XTS mode (disk encryption)

# Networking
tokio-tungstenite = "0.24"  # WebSocket for BTSP tunnel transport only

# Database
sled = "0.34"
serde_yaml = "0.9"

# Serialization
postcard = { version = "1.0", features = ["alloc"] }
rmp-serde = "1.1"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
# hidapi = "2.6"  # ❌ REMOVED - C library, replaced with Pure Rust beardog-hid
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
bytes = "1.5"
parking_lot = "0.12"
base64 = "0.22"
hex = "0.4"
bcrypt = "0.18"  # Legacy password hashing - Phase 7
# JWT: Implemented using RustCrypto (hmac + sha2 + base64) - 100% Pure Rust!

# Configuration
config = "0.14"
figment = { version = "0.10", features = ["toml", "env"] }

# Error handling
color-eyre = "0.6"

# Testing
tempfile = "3.8"
proptest = "1.4"
mockall = "0.12"
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# BearDog internal crates
beardog-types = { path = "crates/beardog-types" }
beardog-errors = { path = "crates/beardog-errors" }
beardog-core = { path = "crates/beardog-core" }
beardog-config = { path = "crates/beardog-config" }
beardog-tunnel = { path = "crates/beardog-tunnel" }
beardog-auth = { path = "crates/beardog-auth" }
beardog-genetics = { path = "crates/beardog-genetics" }
beardog-adapters = { path = "crates/beardog-adapters" }
beardog-monitoring = { path = "crates/beardog-monitoring" }
beardog-ipc = { path = "crates/beardog-ipc" }
beardog-security = { path = "crates/beardog-security" }
beardog-threat = { path = "crates/beardog-threat" }
beardog-traits = { path = "crates/beardog-traits" }
beardog-utils = { path = "crates/beardog-utils" }
beardog-workflows = { path = "crates/beardog-workflows" }
beardog-compliance = { path = "crates/beardog-compliance" }
beardog-cli = { path = "crates/beardog-cli" }
beardog-capabilities = { path = "crates/beardog-capabilities" }
beardog-deploy = { path = "crates/beardog-deploy" }
beardog-production = { path = "crates/beardog-production" }
beardog-node-registry = { path = "crates/beardog-node-registry" }

[package]
name = "beardog"
description = "Zero-trust, sovereign cryptographic workflow orchestrator with hardware security module integration"
keywords = ["cryptography", "hsm", "security", "workflow", "sovereignty"]
categories = ["cryptography", "authentication", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "beardog"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
color-eyre = { workspace = true }
beardog-core = { workspace = true }
beardog-config = { workspace = true }
beardog-types = { workspace = true }
beardog-errors = { workspace = true }
beardog-tunnel = { workspace = true }
beardog-auth = { workspace = true }
beardog-genetics = { workspace = true }
beardog-monitoring = { workspace = true }
beardog-ipc = { path = "crates/beardog-ipc" }
hostname = "0.3"
beardog-security = { workspace = true }
beardog-traits = { workspace = true }
beardog-cli = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serial_test = "3.0"
thiserror = { workspace = true }

# Optional dependencies for examples
# hidapi = { workspace = true, optional = true }  # ❌ REMOVED - C library
beardog-hid = { path = "crates/beardog-hid", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
serial_test = "3.2"
beardog-adapters = { path = "crates/beardog-adapters" }
beardog-capabilities = { path = "crates/beardog-capabilities" }
futures = { workspace = true }
beardog-genetics = { path = "crates/beardog-genetics" }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }  # For E2E tests
tempfile = "3.8"  # For creating temporary Unix sockets in tests
uuid = { workspace = true }  # For chaos tests

[[test]]
name = "chaos"
path = "tests/chaos/mod.rs"
harness = true

[[test]]
name = "fault_injection"
path = "tests/fault_injection/mod.rs"
harness = true

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
debug-assertions = true
overflow-checks = true
incremental = true

# Workspace-wide only (per-crate `[profile.*]` is ignored). `beardog-installer` previously
# duplicated release with `lto = true` (fat LTO); workspace release uses thin LTO for
# faster builds. Use `--profile production` for fat LTO when shipping binaries.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = true
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
# BTSP evolved to Unix socket JSON-RPC! HTTP API deprecated.
# default = ["btsp-api"]  # DEPRECATED: BTSP now uses Unix sockets
default = []
# FIDO2 support - Pure Rust (ecoBin compliant, zero C dependencies)
fido2 = ["beardog-security/fido2", "dep:beardog-hid"]
# mDNS discovery support for primal-to-primal runtime discovery
mdns = ["beardog-core/mdns"]
# BTSP HTTP API DEPRECATED - evolved to Unix socket JSON-RPC!
# btsp-api = ["beardog-tunnel/btsp-api"]  # DEPRECATED: Use Unix socket BTSP instead
full = ["fido2", "mdns"]  # Removed btsp-api - BTSP now pure Unix sockets
