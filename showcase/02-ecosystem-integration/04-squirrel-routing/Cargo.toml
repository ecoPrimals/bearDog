[package]
name = "beardog-squirrel-demo"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

# Standalone package (not part of parent workspace)
[workspace]

[dependencies]
# BearDog crates
beardog-errors = { path = "../../../crates/beardog-errors" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Hashing
blake3 = { version = "1.5", features = ["pure"] }

# Regex for PII detection
regex = "1.10"

# UUID for anonymous IDs
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time
chrono = "0.4"

# Concurrency
parking_lot = "0.12"

[[bin]]
name = "beardog-squirrel-demo"
path = "src/main.rs"

