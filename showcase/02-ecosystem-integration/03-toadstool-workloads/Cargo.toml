[package]
name = "beardog-toadstool-demo"
version = "0.1.0"
edition = "2021"

# Standalone package (not part of parent workspace)
[workspace]

[dependencies]
# BearDog crates
beardog-genetics = { path = "../../../crates/beardog-genetics" }
beardog-errors = { path = "../../../crates/beardog-errors" }
beardog-tunnel = { path = "../../../crates/beardog-tunnel" }
beardog-types = { path = "../../../crates/beardog-types" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Cryptography
blake3 = { version = "1.5", features = ["pure"] }
zeroize = "1.8"

# Concurrency
parking_lot = "0.12"

# Utilities
chrono = "0.4"
getrandom = "0.2"

[[bin]]
name = "beardog-toadstool-demo"
path = "src/main.rs"

