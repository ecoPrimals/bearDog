[package]
name = "beardog-songbird-btsp-demo"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# Standalone package (not part of parent workspace)
[workspace]

[dependencies]
# BearDog crates
beardog-tunnel = { path = "../../../crates/beardog-tunnel", features = ["btsp-api"] }
beardog-types = { path = "../../../crates/beardog-types" }
beardog-core = { path = "../../../crates/beardog-core" }
beardog-errors = { path = "../../../crates/beardog-errors" }
beardog-genetics = { path = "../../../crates/beardog-genetics" }
beardog-capabilities = { path = "../../../crates/beardog-capabilities" }
beardog-discovery = { path = "../../../crates/beardog-discovery" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Networking (if needed)
reqwest = { version = "0.11", features = ["json"], optional = true }

# Concurrency
parking_lot = "0.12"

[features]
default = ["http-client"]
# Enable if we need HTTP client for Songbird API
http-client = ["reqwest"]

[[bin]]
name = "songbird-btsp-demo"
path = "src/main.rs"

