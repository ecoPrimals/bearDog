[ceremony]
name = "receipt-verification-demo"
description = "Cryptographic receipt verification and forensic analysis"
max_duration_ms = 200

[receipts]
# Receipt generation
hash_algorithm = "blake3"
signature_algorithm = "ed25519"
enable_chain_linking = true

[verification]
# Verification settings
check_signatures = true
check_hash_chain = true
check_timestamps = true
detect_tampering = true

[forensics]
# Forensic analysis
enable_timeline = true
enable_chain_of_custody = true
compliance_standards = ["soc2", "hipaa", "pci_dss", "gdpr"]

[performance]
receipt_generation_target_ms = 10
verification_target_ms = 5
forensic_analysis_target_ms = 50
tamper_detection_accuracy = 100

[validation]
test_generation = true
test_verification = true
test_tamper_detection = true
test_forensics = true
test_compliance = true

[audit]
log_level = "info"
include_performance = true
hash_algorithm = "blake3"

