[ceremony]
name = "constraint-composition-demo"
description = "Composable constraint framework demonstration"
max_duration_ms = 200

[constraints]
# Constraint operators
enable_and = true
enable_or = true
enable_not = true
enable_implies = true

# Composition features
enable_nesting = true
max_nesting_depth = 5
enable_inheritance = true

[conflict_resolution]
# Resolution strategies
strategy = "most-restrictive"  # or "explicit-wins", "latest-wins"
detect_conflicts = true
fail_on_unresolvable = true

[validation]
# Runtime validation
enable_runtime_checks = true
cache_evaluations = true
performance_target_ms = 10

[performance]
composition_target_ms = 5
validation_target_ms = 10
conflict_detection_target_ms = 20
resolution_target_ms = 15

[audit]
log_level = "info"
include_performance = true
log_constraint_trees = true

