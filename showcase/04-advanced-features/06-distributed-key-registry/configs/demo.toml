[ceremony]
name = "distributed-key-registry-demo"
description = "Multi-node distributed key registry with consensus"
max_duration_ms = 500

[cluster]
# Number of nodes in the cluster
num_nodes = 4
# Byzantine fault tolerance: tolerates f faults in 3f+1 system
# With 4 nodes, we tolerate 1 fault (f=1, 3f+1=4)
fault_tolerance = 1

[consensus]
# Consensus algorithm (simplified PBFT)
algorithm = "pbft"
# Quorum requirements
read_quorum = 2    # f+1 = 1+1 = 2
write_quorum = 3   # 2f+1 = 2*1+1 = 3
# Timeouts (milliseconds)
proposal_timeout_ms = 100
vote_timeout_ms = 50
commit_timeout_ms = 50

[versioning]
# Version control strategy
strategy = "vector_clock"
# Conflict resolution
conflict_resolution = "last_write_wins"

[performance]
# Performance targets (milliseconds)
registration_target_ms = 100
discovery_target_ms = 10
sync_target_ms = 50
conflict_resolution_target_ms = 20

[validation]
test_registration = true
test_discovery = true
test_consensus = true
test_fault_tolerance = true
test_versioning = true
test_conflict_resolution = true

[audit]
log_level = "info"
include_performance = true
include_consensus_details = true
hash_algorithm = "blake3"

