[package]
name = "beardog-distributed-key-registry"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]
# Standalone demo

[[bin]]
name = "distributed-key-registry"
path = "src/main.rs"

[dependencies]
# Core
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
blake3 = "1.5"
hex = "0.4"
rand = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

