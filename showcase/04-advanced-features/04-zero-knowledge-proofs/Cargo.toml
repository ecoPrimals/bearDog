[package]
name = "beardog-zero-knowledge-proofs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# Standalone package (not part of parent workspace)
[workspace]

[dependencies]
# BearDog core
beardog-core = { path = "../../../crates/beardog-core" }
beardog-errors = { path = "../../../crates/beardog-errors" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Crypto primitives
blake3 = "1.5"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
rand = "0.9"

# Big integers for ZKP
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# Elliptic curves for ZKP
curve25519-dalek = "4.1"
ed25519-dalek = "2.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []

[[bin]]
name = "zero-knowledge-proofs"
path = "src/main.rs"

