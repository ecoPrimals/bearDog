[ceremony]
name = "benchmarking-performance-demo"
description = "Comprehensive performance benchmarking"
max_duration_ms = 10000

[benchmarks]
# Benchmark configuration
num_iterations = 100
warmup_iterations = 10
enable_profiling = true

[categories]
# Benchmark categories
cryptographic = true
key_management = true
storage = true
network = true
ecosystem = true

[targets]
# Performance targets (ms)
key_generation = 10
signing = 1
verification = 1
encryption = 5
decryption = 5
hashing = 1
key_derivation = 10
key_rotation = 100
constraint_validation = 5
storage_write = 20
storage_read = 10
network_connection = 100
multi_primal = 500
consensus = 500

[validation]
# Validation settings
require_all_pass = true
allow_margin = 0.2  # 20% margin
report_percentiles = true

[audit]
log_level = "info"
include_performance = true
generate_report = true

