[package]
name = "beardog-benchmarking-performance"
version = "0.1.0"
edition = "2021"

[workspace]
# Standalone demo

[[bin]]
name = "benchmarking-performance"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = "2.1"
blake3 = "1.5"
rand = "0.8"

