[package]
name = "beardog-hardware-attestation"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# Standalone package (not part of parent workspace)
[workspace]

[dependencies]
# BearDog core
beardog-core = { path = "../../../crates/beardog-core" }
beardog-errors = { path = "../../../crates/beardog-errors" }
beardog-security = { path = "../../../crates/beardog-security" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Crypto & Hashing
blake3 = { version = "1.5", features = ["pure"] }
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
ed25519-dalek = "2.1"
rand = "0.9"

# X.509 certificates
x509-cert = "0.2"
der = "0.7"
pem = "3.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Base64 encoding
base64 = "0.22"

[features]
default = []

[[bin]]
name = "hardware-attestation"
path = "src/main.rs"

