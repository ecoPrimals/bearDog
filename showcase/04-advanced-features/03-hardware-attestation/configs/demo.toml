[ceremony]
name = "hardware-attestation-demo"
description = "Hardware attestation chain verification"
max_duration_ms = 1000

[attestation_policy]
# Policy level: strict, moderate, permissive
level = "strict"

# Required attestation types
require_hardware_identity = true
require_boot_integrity = true
require_key_storage_proof = true
require_operation_proof = true

# Certificate validation
validate_certificate_chain = true
allow_self_signed = false  # For demo purposes, set to true
max_chain_depth = 5

# Tamper detection
enable_tamper_detection = true
tamper_threshold_score = 80  # 0-100, higher = stricter

[hsm_types]
# Supported HSM types for attestation
supported = [
    "yubikey",
    "tpm",
    "strongbox",
    "secure_enclave",
    "software"  # For demo only
]

# Software HSM allowed only for demo
allow_software_hsm = true

[remote_attestation]
# Remote attestation settings
enabled = true
challenge_size_bytes = 32
nonce_timeout_ms = 30000
require_mutual_attestation = true

[measurements]
# Boot and runtime measurements
boot_pcr_indices = [0, 1, 2, 3, 7]  # TPM PCRs for secure boot
runtime_pcr_indices = [10, 11, 12]   # TPM PCRs for runtime

[audit]
log_level = "info"
include_performance = true
include_certificate_details = true
hash_algorithm = "blake3"

