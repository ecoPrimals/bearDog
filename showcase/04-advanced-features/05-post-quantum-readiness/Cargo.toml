[package]
name = "beardog-post-quantum-readiness"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]
# This is a standalone demo, not part of the main workspace

[[bin]]
name = "post-quantum-readiness"
path = "src/main.rs"

[dependencies]
# Core dependencies
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography - Post-Quantum
# Note: Using simulated PQC for demonstration
# In production, use actual PQC libraries like:
# - pqcrypto (pqcrypto-kyber, pqcrypto-dilithium)
# - oqs (liboqs bindings)
# - pq-sys (CRYSTALS implementation)

# Cryptography - Classical (for hybrid mode)
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
rand = "0.9"
sha2 = "0.10"
blake3 = "1.5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
hex = "0.4"

[dev-dependencies]
criterion = "0.5"

