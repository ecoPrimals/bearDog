[ceremony]
name = "post-quantum-readiness-demo"
description = "Post-quantum cryptography readiness and migration validation"
max_duration_ms = 1000

[algorithms]
# Classical algorithms (for comparison and hybrid mode)
classical_signature = "ed25519"
classical_kem = "x25519"

# Post-quantum algorithms (NIST standards)
pqc_signature = "dilithium3"  # ML-DSA-65 (FIPS 204)
pqc_kem = "kyber768"          # ML-KEM-768 (FIPS 203)

[security_levels]
# Target security levels (bits)
classical = 128
post_quantum = 192
hybrid = 192  # Max of both

[migration]
# Migration strategy
current_phase = "hybrid"  # Options: classical, hybrid, post_quantum
enable_classical = true
enable_pqc = true
require_both = true  # For hybrid mode

[performance]
# Performance targets (milliseconds)
keygen_target_ms = 1
encap_target_ms = 1
decap_target_ms = 1
sign_target_ms = 5
verify_target_ms = 3
hybrid_target_ms = 10

# Enable performance profiling
profile_operations = true
compare_classical_pqc = true

[compliance]
# Compliance standards
nist_standardized = true
fips_203_compliant = true  # ML-KEM
fips_204_compliant = true  # ML-DSA
cnsa_2_0_ready = true      # NSA CNSA 2.0

[validation]
# Validation settings
test_key_generation = true
test_encapsulation = true
test_signatures = true
test_hybrid_mode = true
test_migration_path = true

[audit]
log_level = "info"
include_performance = true
include_size_comparison = true
hash_algorithm = "blake3"

