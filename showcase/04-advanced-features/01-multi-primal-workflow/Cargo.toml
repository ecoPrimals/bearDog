[package]
name = "beardog-multi-primal-workflow"
version = "0.1.0"
edition = "2021"

# Standalone package (not part of parent workspace)
[workspace]

[dependencies]
# BearDog core
beardog-core = { path = "../../../crates/beardog-core" }
beardog-errors = { path = "../../../crates/beardog-errors" }
beardog-genetics = { path = "../../../crates/beardog-genetics" }
beardog-capabilities = { path = "../../../crates/beardog-capabilities" }
beardog-tunnel = { path = "../../../crates/beardog-tunnel" }
beardog-discovery = { path = "../../../crates/beardog-discovery" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Crypto & Hashing
blake3 = "1.5"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Compression (for storage simulation)
zstd = "0.13"

# Regex (for PII sanitization)
regex = "1"

[features]
default = []

[[bin]]
name = "multi-primal-workflow"
path = "src/main.rs"

