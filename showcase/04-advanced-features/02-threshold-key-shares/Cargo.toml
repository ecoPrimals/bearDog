[package]
name = "beardog-threshold-key-shares"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# Standalone package (not part of parent workspace)
[workspace]

[dependencies]
# BearDog core
beardog-core = { path = "../../../crates/beardog-core" }
beardog-errors = { path = "../../../crates/beardog-errors" }
beardog-genetics = { path = "../../../crates/beardog-genetics" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Crypto & Hashing
blake3 = { version = "1.5", features = ["pure"] }
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Shamir's Secret Sharing
sharks = "0.5"

# Random number generation
rand = "0.8"

[features]
default = []

[[bin]]
name = "threshold-key-shares"
path = "src/main.rs"

