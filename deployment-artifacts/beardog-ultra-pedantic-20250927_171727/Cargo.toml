[workspace]
resolver = "2"
members = [
    "crates/beardog",
    "crates/beardog-adapters",
    "crates/beardog-api", 
    "crates/beardog-auth",
    "crates/beardog-cli",
    "crates/beardog-compliance",
    "crates/beardog-core",
    "crates/beardog-deploy",
    "crates/beardog-errors",
    "crates/beardog-genetics",
    "crates/beardog-integration-tests",
    "crates/beardog-monitoring",
    "crates/beardog-node-registry",
    "crates/beardog-production",
    "crates/beardog-security",
    "crates/beardog-security-registry",
    "crates/beardog-threat",
    "crates/beardog-traits",
    "crates/beardog-tunnel",
    "crates/beardog-types",
    "crates/beardog-utils",
    "crates/beardog-workflows",
    "android",
    "benchmarks",
]

[workspace.package]
version = "3.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["BearDog Team <team@beardog.dev>"]
repository = "https://github.com/eastgate-software/beardog"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
rust-version = "1.75"

[workspace.dependencies]
# BearDog workspace crates
beardog-core = { path = "crates/beardog-core" }
beardog-errors = { path = "crates/beardog-errors" }
beardog-types = { path = "crates/beardog-types" }
beardog-traits = { path = "crates/beardog-traits" }
beardog-security = { path = "crates/beardog-security" }
beardog-auth = { path = "crates/beardog-auth" }
beardog-api = { path = "crates/beardog-api" }
beardog-genetics = { path = "crates/beardog-genetics" }
beardog-threat = { path = "crates/beardog-threat" }
beardog-tunnel = { path = "crates/beardog-tunnel" }
beardog-adapters = { path = "crates/beardog-adapters" }
beardog-compliance = { path = "crates/beardog-compliance" }
beardog-monitoring = { path = "crates/beardog-monitoring" }
beardog-node-registry = { path = "crates/beardog-node-registry" }
beardog-production = { path = "crates/beardog-production" }
beardog-utils = { path = "crates/beardog-utils" }
beardog-workflows = { path = "crates/beardog-workflows" }
beardog-cli = { path = "crates/beardog-cli" }
beardog-deploy = { path = "crates/beardog-deploy" }

# Core async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# Cryptography
ed25519-dalek = "2.1"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
zeroize = "1.7"
argon2 = "0.5"
base64 = "0.22"

# Networking
reqwest = { version = "0.11", features = ["json", "stream"] }
hickory-resolver = "0.24"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ahash = "0.8"
dashmap = "5.5"
bytes = "1.5"
url = "2.5"
hex = "0.4"
urlencoding = "2.1"
regex = "1.10"

# HTTP and Web
axum = "0.7"
tower = "0.4"
hyper = "1.0"

# Testing and mocking
mockall = "0.12"

# Development dependencies
tokio-test = "0.4"

# Additional commonly used crates
clap = { version = "4.0", features = ["derive"] }
config = "0.14"
env_logger = "0.11"
once_cell = "1.19"
hostname = "0.4"
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

# Allow some pedantic lints that are overly strict for our use case
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
debug = false
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
debug = true
opt-level = 1 