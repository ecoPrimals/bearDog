# SPDX-License-Identifier: AGPL-3.0-or-later
# agentReagents Template: bearDog Android Keystore Validation
#
# Validation substrate for the bearDog AndroidStrongBoxHsm backend.
# Targets real Pixel 8 (Tensor G3 / Titan M2) hardware via eastGate,
# with a software-emulated fallback for CI on x86_64 via QEMU ARM64.
#
# Reference:
#   - specs/current/testing/TESTING_STRATEGY_TOWER_PIXEL8.md
#   - specs/current/testing/VENDOR_AGNOSTIC_TESTING_MATRIX.md
#   - infra/wateringHole/GATE_DEPLOYMENT_STANDARD.md

name: beardog-android-keystore-validation
version: "1.0.0"
description: >
  Validation substrate for bearDog's Android Keystore HSM backend.
  Two modes: (1) real Pixel 8 via ADB from eastGate, or
  (2) QEMU ARM64 emulation on x86_64 towers for CI gating.
  Exercises StrongBox key generation, Ed25519 sign/verify,
  AES-256-GCM encrypt/decrypt, and device attestation chain.

# --- Mode 1: Real Pixel 8 (eastGate) ---
# Requires: USB-attached Pixel 8 with GrapheneOS, ADB authorized.
# agentReagents will skip VM provisioning and drive ADB directly.

hardware_target:
  device: "Pixel 8"
  soc: "Tensor G3"
  secure_element: "Titan M2 (StrongBox)"
  os: "GrapheneOS (latest stable)"
  connection: "USB/ADB from eastGate"
  arch: aarch64

# --- Mode 2: QEMU ARM64 Emulation (CI fallback) ---

resources:
  memory_mb: 4096
  vcpus: 4
  disk_gb: 20
  timeout_secs: 3600

base_image: ubuntu-24.04-server-cloudimg-arm64.img

users:
  - name: beardogtest
    groups: [sudo]
    ssh_authorized_keys: []

build_steps:
  - type: wait_cloud_init
    timeout_secs: 600

  - type: install_packages
    packages:
      - openssh-server
      - curl
      - ca-certificates
      - jq
      - android-tools-adb
      - android-tools-fastboot

  - type: enable_service
    service: ssh

  - type: create_file
    path: /etc/beardog/android-keystore-validation.conf
    content: |
      # bearDog Android Keystore validation substrate
      BEARDOG_HSM_MODE=android-keystore
      BEARDOG_STRONGBOX_REQUIRED=true
      BEARDOG_ATTESTATION_VERIFY=true
      BEARDOG_TEST_TIMEOUT=120
      BEARDOG_PORT=9100
      RUST_LOG=beardog=debug,beardog_tunnel::tunnel::hsm=trace
    mode: "0644"

post_boot_steps:
  - type: run_command
    command: "mkdir -p /opt/plasmidBin /var/log/beardog /etc/beardog"
    description: "Create bearDog deployment directories"

  - type: run_command
    command: |
      PLASMID_BIN="${PLASMID_BIN:-/opt/plasmidBin}"
      ARCH="$(uname -m)"
      SRC="${PLASMID_BIN}/primals/${ARCH}"
      if [ -f "${SRC}/beardog" ]; then
        cp "${SRC}/beardog" /opt/plasmidBin/
      elif command -v fetch.sh >/dev/null 2>&1; then
        fetch.sh pull beardog --arch "${ARCH}" --dest /opt/plasmidBin/
      fi
      chmod +x /opt/plasmidBin/* 2>/dev/null || true
    description: "Deploy bearDog binary from plasmidBin"

  - type: create_file
    path: /opt/beardog-android-keystore-validate.sh
    content: |
      #!/usr/bin/env bash
      # Android Keystore HSM validation script.
      # Exercises the bearDog AndroidStrongBoxHsm backend via JSON-RPC.
      set -euo pipefail

      BEARDOG="${BEARDOG_BINARY:-/opt/plasmidBin/beardog}"
      PORT="${BEARDOG_PORT:-9100}"
      BIND="127.0.0.1"

      echo "=== bearDog Android Keystore Validation ==="
      echo "Binary: $BEARDOG"
      echo "Port:   $PORT"

      # Start bearDog with HSM tracing
      RUST_LOG=beardog=debug,beardog_tunnel::tunnel::hsm=trace \
        "$BEARDOG" server --listen "${BIND}:${PORT}" &
      BD_PID=$!
      trap 'kill $BD_PID 2>/dev/null; wait $BD_PID 2>/dev/null' EXIT

      # Wait for ready
      for i in $(seq 1 30); do
        if curl -sf "http://${BIND}:${PORT}/" \
          -H "Content-Type: application/json" \
          -d '{"jsonrpc":"2.0","method":"ping","id":0}' >/dev/null 2>&1; then
          echo "[ready] bearDog server up (PID $BD_PID)"
          break
        fi
        sleep 1
      done

      PASS=0; FAIL=0
      rpc() {
        curl -sf --max-time 10 -X POST \
          -H "Content-Type: application/json" \
          -d "$1" "http://${BIND}:${PORT}/" 2>/dev/null
      }

      # Phase 1: HSM provider discovery
      echo ""
      echo "--- Phase 1: HSM Provider Discovery ---"
      resp=$(rpc '{"jsonrpc":"2.0","method":"primal.info","id":1}')
      echo "primal.info: $resp"

      # Phase 2: Ed25519 keypair (routed through HSM)
      echo ""
      echo "--- Phase 2: Ed25519 Keypair via HSM ---"
      resp=$(rpc '{"jsonrpc":"2.0","method":"crypto.ed25519_generate_keypair","id":2}')
      pubkey=$(echo "$resp" | jq -r '.result.public_key // empty')
      if [ -n "$pubkey" ]; then
        echo "  PASS: ed25519_generate_keypair -> public_key"
        PASS=$((PASS + 1))
      else
        echo "  FAIL: ed25519_generate_keypair"
        FAIL=$((FAIL + 1))
      fi

      # Phase 3: Sign + Verify roundtrip
      echo ""
      echo "--- Phase 3: Sign/Verify Roundtrip ---"
      MSG="QW5kcm9pZCBLZXlzdG9yZSBWYWxpZGF0aW9u"
      resp=$(rpc "{\"jsonrpc\":\"2.0\",\"method\":\"crypto.sign_ed25519\",\"params\":{\"message\":\"$MSG\"},\"id\":3}")
      sig=$(echo "$resp" | jq -r '.result.signature // empty')
      spk=$(echo "$resp" | jq -r '.result.public_key // empty')
      if [ -n "$sig" ] && [ -n "$spk" ]; then
        echo "  PASS: sign_ed25519 -> signature"
        PASS=$((PASS + 1))
        vresp=$(rpc "{\"jsonrpc\":\"2.0\",\"method\":\"crypto.verify_ed25519\",\"params\":{\"message\":\"$MSG\",\"signature\":\"$sig\",\"public_key\":\"$spk\"},\"id\":4}")
        valid=$(echo "$vresp" | jq -r '.result.valid // empty')
        if [ "$valid" = "true" ]; then
          echo "  PASS: verify_ed25519 -> valid"
          PASS=$((PASS + 1))
        else
          echo "  FAIL: verify_ed25519"
          FAIL=$((FAIL + 1))
        fi
      else
        echo "  FAIL: sign_ed25519"
        FAIL=$((FAIL + 1))
      fi

      # Phase 4: AES-256-GCM encrypt/decrypt
      echo ""
      echo "--- Phase 4: AES-256-GCM AEAD ---"
      resp=$(rpc "{\"jsonrpc\":\"2.0\",\"method\":\"crypto.aes256_gcm_encrypt\",\"params\":{\"plaintext\":\"$MSG\"},\"id\":5}")
      ct=$(echo "$resp" | jq -r '.result.ciphertext // empty')
      if [ -n "$ct" ]; then
        echo "  PASS: aes256_gcm_encrypt -> ciphertext"
        PASS=$((PASS + 1))
      else
        echo "  FAIL: aes256_gcm_encrypt"
        FAIL=$((FAIL + 1))
      fi

      echo ""
      echo "=== Summary: PASS=$PASS FAIL=$FAIL ==="
      [ "$FAIL" -eq 0 ] && exit 0 || exit 1
    mode: "0755"

verification:
  required_packages:
    - openssh-server
    - jq
  required_files:
    - /etc/beardog/android-keystore-validation.conf
    - /opt/beardog-android-keystore-validate.sh
  verification_commands:
    - command: "test -x /opt/beardog-android-keystore-validate.sh"
      description: "Validation script is executable"
      expected_exit_code: 0
    - command: "test -d /opt/plasmidBin"
      description: "plasmidBin directory exists"
      expected_exit_code: 0

metadata:
  gate_standard: "GATE_DEPLOYMENT_STANDARD.md"
  primal: "bearDog"
  hsm_backend: "AndroidStrongBox"
  validation_target: "Android Keystore + StrongBox (Titan M2)"
  hardware_required: "Pixel 8 (Tensor G3) or QEMU ARM64 emulation"
  eastgate_team: true
  arch: "aarch64"
