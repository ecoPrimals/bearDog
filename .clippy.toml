# BearDog Pedantic Clippy Configuration - Balanced Excellence
# Enforces high standards while maintaining practicality

# Version requirements
msrv = "1.75.0"

# Cognitive complexity limits (reasonable)
cognitive-complexity-threshold = 15

# Type complexity limits  
type-complexity-threshold = 300

# Performance optimizations
trivial-copy-size-limit = 128
pass-by-value-size-limit = 256

# Function complexity (balanced)
too-many-lines-threshold = 150
too-many-arguments-threshold = 8

# Safety settings - high standards but practical
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = false
allow-dbg-in-tests = false

# Naming conventions - enforce quality names
disallowed-names = ["foo", "bar", "baz", "tmp", "temp"]

# Performance thresholds
vec-box-size-threshold = 4096
large-error-threshold = 256
enum-variant-size-threshold = 512

# Practical strictness
single-char-binding-names-threshold = 2 