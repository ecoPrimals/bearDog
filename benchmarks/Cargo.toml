[package]
name = "beardog-benchmarks"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "performance_optimization_benchmarks"
harness = false

[[bench]]
name = "security_performance_benchmarks"
harness = false

[dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
beardog-security = { path = "../crates/beardog-security" }
beardog-config = { path = "../crates/beardog-config" }
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "beardog_benchmarks"
path = "src/lib.rs" 