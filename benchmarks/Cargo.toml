[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"
description = "Performance benchmarks and testing framework"
publish = false
readme = "README.md"
license = "AGPL-3.0-or-later"
homepage.workspace = true
repository = "https://github.com/ecoPrimals/beardog"
authors = ['BearDog Security Team']
keywords = ['security', 'hsm', 'threat-detection', 'compliance', 'workflow']
categories = ['cryptography', 'authentication', 'web-programming', 'network-programming']
rust-version = "1.93.0"

[[bench]]
name = "hsm_operations_benchmarks"
harness = false

[[bench]]
name = "discovery_benchmarks"
harness = false

[[bench]]
name = "production_workload_benchmarks"
harness = false

[[bench]]
name = "crypto_throughput"
harness = false

[lints]
workspace = true

[dependencies]
beardog-core = { workspace = true }
beardog-errors = { workspace = true }
beardog-security = { workspace = true }
beardog-types = { workspace = true }
beardog-utils = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
criterion = { workspace = true }
# Optional: pprof links to C (libc); default build is ecoBin-compliant
pprof = { version = "0.13", features = ["criterion", "flamegraph"], optional = true }
tokio = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Enable flamegraph profiling (pprof links to C; opt-in for ecoBin compliance)
profiling = ["dep:pprof"]