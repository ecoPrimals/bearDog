# BearDog Capability Registry — Machine-Readable Self-Knowledge
# SPDX-License-Identifier: AGPL-3.0-or-later
# Copyright (c) 2025-2026 ecoPrimals Collective
#
# Self-knowledge for primal discovery and biomeOS capability routing.
# BearDog's full method surface (226 methods) is defined in code via
# HandlerRegistry; this file declares capability domains for routing.
#
# Stability tiers:
#   stable      — API surface frozen; breaking changes require major version bump
#   provisional — API surface complete and tested but may evolve in minor versions
#   experimental — early implementation; may change or be removed without notice

[primal]
name = "beardog"
domain = "crypto"
version = "4.0.0"
license = "AGPL-3.0-or-later"
description = "Cryptographic identity, authentication, and key management primal — Ed25519, BTSP, ionic bonds, lineage"
transport = ["uds", "tcp"]
protocol = "jsonrpc-2.0"

[capabilities.crypto]
domain = "crypto"
stability = "stable"
description = "Core cryptography — signatures, encryption, hashing, KDF, key exchange"
methods = [
    "crypto.sign_ed25519", "crypto.verify_ed25519",
    "crypto.sign.ed25519", "crypto.verify.ed25519",
    "crypto.sign", "crypto.verify",
    "crypto.encrypt", "crypto.decrypt",
    "crypto.hash", "crypto.hmac",
    "crypto.generate_keypair", "crypto.derive_secret",
]

[capabilities.auth]
domain = "auth"
stability = "stable"
description = "Authentication gate — caller identity, enforcement mode, ionic token verification"
methods = [
    "auth.check", "auth.mode", "auth.peer_info",
    "auth.issue_ionic", "auth.verify_ionic",
    "auth.issue_session", "auth.public_key",
    "auth.trust_issuer", "auth.trusted_issuers",
    "auth.exchange_trust", "auth.events.poll",
]

[capabilities.auth_events]
domain = "auth"
stability = "provisional"
description = "Trust event notifications — poll-based event log for cross-gate provenance"
methods = ["auth.events.poll"]

[capabilities.auth_token]
domain = "auth"
stability = "provisional"
description = "Forgejo API token lifecycle — create, list, revoke tokens on the inner membrane forge"
methods = ["auth.token.create", "auth.token.list", "auth.token.revoke"]

# ── Token management protocol (shadow — Wave 61) ────────────────
# auth.token.list:   {} → {tokens: [{id, name, created}]}
#   Lists all Forgejo API tokens from the VPS database.
# auth.token.create: {name, scopes?} → {token, name, scopes}
#   Generates a new scoped API token via Forgejo admin CLI.
#   Default scopes: write:repository,read:repository,write:organization,read:organization
# auth.token.revoke: {id} → {revoked: true}
#   Deletes a token by database row ID.
#
# Shadow implementation: membrane-shadow crate (cellMembrane).
# Token management proxies to the Forgejo admin CLI and database
# on golgiBody via SSH. Future: native bearDog integration with
# Forgejo's internal token API.

[capabilities.btsp]
domain = "btsp"
stability = "stable"
description = "BTSP tunnel protocol — contact exchange, encrypted sessions, TLS shadow"
methods = [
    "btsp.negotiate", "btsp.capabilities",
    "btsp.contact.exchange",
    "btsp.tunnel.establish", "btsp.tunnel.encrypt",
    "btsp.tunnel.decrypt", "btsp.tunnel.status", "btsp.tunnel.close",
]

[capabilities.ionic_bond]
domain = "crypto"
stability = "stable"
description = "Ionic bond lifecycle — propose, accept, seal, verify, revoke cross-family contracts"
methods = [
    "crypto.ionic_bond.propose", "crypto.ionic_bond.accept",
    "crypto.ionic_bond.seal", "crypto.ionic_bond.verify",
    "crypto.ionic_bond.revoke", "crypto.ionic_bond.list",
]

[capabilities.lineage]
domain = "lineage"
stability = "stable"
description = "Genetic lineage — derivation, verification, family identity"
methods = ["lineage.list", "lineage.verify", "lineage.get"]

[capabilities.health]
domain = "health"
stability = "stable"
description = "Liveness, readiness, and health check endpoints"
methods = ["health.liveness", "health.readiness", "health.check"]

[capabilities.identity]
domain = "identity"
stability = "stable"
description = "Primal identity and self-knowledge"
methods = ["identity.get", "identity.create"]

[capabilities.discovery]
domain = "discovery"
stability = "stable"
description = "Capability advertisement and listing"
methods = ["capabilities.list", "discover.capabilities"]

[capabilities.capability_router]
domain = "routing"
stability = "stable"
description = "Generic capability-addressed dispatch (Songbird federation bridge)"
methods = ["capability.call"]

# Neural API announce — self-registration with biomeOS
[announce]
method = "primal.announce"
target = "biomeos"
signal_tiers = ["tower"]
capabilities = ["crypto", "auth", "btsp"]
cost_hints = { crypto = 5.0, auth = 2.0, btsp = 8.0 }
latency_estimates = { crypto = 10, auth = 5, btsp = 50 }
trigger = "post-bind"

# Consumed capabilities
[consumed_capabilities.storage]
reason = "Ionic bond ledger persistence via nestGate"
required = false
