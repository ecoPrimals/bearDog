name: BearDog CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust (pinned via rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.93.0"
        components: rustfmt, clippy

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy (workspace lints, -D warnings)
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Doc check
      run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

    - name: Build
      run: cargo build --workspace --all-targets

    - name: File size compliance (1000 LOC max)
      run: |
        OVERSIZED=$(find . -name "*.rs" -not -path "./target/*" -not -path "./archives/*" -exec wc -l {} \; | awk '$1 > 1000 {print $2 " has " $1 " lines"}')
        if [ -n "$OVERSIZED" ]; then
          echo "Files exceeding 1000 lines:"
          echo "$OVERSIZED"
          exit 1
        fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.93.0"

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/
          ~/.cargo/git/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Test (workspace)
      run: cargo test --workspace

    - name: Doc tests
      run: cargo test --workspace --doc

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.93.0"

    - name: cargo deny
      run: |
        cargo install cargo-deny --locked
        cargo deny check

    - name: cargo audit
      run: |
        cargo install cargo-audit --locked
        cargo audit
