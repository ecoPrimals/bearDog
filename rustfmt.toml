# BearDog Pedantic Rustfmt Configuration (Stable Features Only)
# Maximum code quality with stable Rust features

edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
reorder_imports = true
reorder_modules = true
fn_params_layout = "Tall"
force_explicit_abi = true
use_field_init_shorthand = true
use_try_shorthand = true
match_arm_leading_pipes = "Never"