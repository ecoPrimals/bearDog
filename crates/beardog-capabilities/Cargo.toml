[package]
name = "beardog-capabilities"
version.workspace = true
edition = "2024"
authors = ["ecoPrimals Team"]
description = "Capability-based primal interaction framework for BearDog - enabling sovereign service discovery and dynamic capability negotiation"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
homepage = "https://beardog.dev"
documentation = "https://docs.beardog.dev"
readme = "README.md"
keywords = ["capabilities", "security", "primal", "sovereignty", "discovery"]
categories = ["cryptography", "network-programming", "api-bindings"]

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
beardog-config = { workspace = true }
beardog-errors = { workspace = true }

# Optional: mDNS discovery
mdns-sd = { workspace = true, optional = true }

[features]
default = ["mdns"]
mdns = ["mdns-sd"]
