[package]
name = "beardog-genetics"
description = "BearDog genetics module"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "genetics", "evolution", "algorithms", "beardog", "computation",]
categories = [ "algorithms", "science", "development-tools",]
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
rand = { workspace = true }
serde_json = "1.0"
hex = "0.4"
ed25519-dalek = "2.1"
blake3 = { version = "1.5", features = ["pure"] }  # Pure Rust (no C assembly) for universal portability
postcard = { workspace = true }
crossterm = "0.27"  # Terminal input/output for interactive entropy collection
hkdf = "0.12"       # HKDF for BirdSong key derivation
chacha20poly1305 = "0.10"  # BirdSong encryption
parking_lot = "0.12"  # Faster RwLock for BirdSong

[features]
# Platform features for entropy collection
microphone = []  # Enable microphone-based entropy collection (requires platform audio APIs)
camera = []      # Enable camera-based entropy collection (requires platform camera APIs)

default = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.authors]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-auth]
workspace = true

[dependencies.beardog-security]
path = "../beardog-security"

[dependencies.beardog-types]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.sha2]
workspace = true

[dependencies.sha3]
workspace = true

[dependencies.zeroize]
workspace = true

[dev-dependencies]
anyhow = { workspace = true }
