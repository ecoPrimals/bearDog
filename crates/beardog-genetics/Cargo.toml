[package]
name = "beardog-genetics"
description = "BearDog genetics module"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "genetics", "evolution", "algorithms", "beardog", "computation",]
categories = [ "algorithms", "science", "development-tools",]

[dependencies]
rand = "0.8"
serde_json = "1.0"
hex = "0.4"
ed25519-dalek = "2.1"
blake3 = "1.5"
bincode = "1.3"
crossterm = "0.27"  # Terminal input/output for interactive entropy collection

[features]
zero-cost-architecture = []
universal-discovery = []
primal-sovereignty = []
ecosystem = []
default = []
genetics_tests_disabled_during_refactor = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-auth]
workspace = true

[dependencies.beardog-types]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.sha2]
workspace = true

[dependencies.sha3]
workspace = true

[dependencies.zeroize]
workspace = true
