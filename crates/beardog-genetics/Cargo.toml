[package]
name = "beardog-genetics"
description = "BearDog genetics module"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "genetics", "evolution", "algorithms", "beardog", "computation",]
categories = [ "algorithms", "development-tools",]
readme = "README.md"
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
rand = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
postcard = { workspace = true }
crossterm = { workspace = true }
hkdf = { workspace = true }
chacha20poly1305 = { workspace = true }
parking_lot = { workspace = true }

[features]
# Platform features for entropy collection
microphone = []  # Enable microphone-based entropy collection (requires platform audio APIs)

default = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.authors]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-config]
workspace = true

[dependencies.beardog-auth]
workspace = true

[dependencies.beardog-security]
workspace = true

[dependencies.beardog-types]
workspace = true

[dependencies.tokio]
workspace = true
features = ["rt", "macros"]

[dependencies.serde]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.sha2]
workspace = true

[dependencies.sha3]
workspace = true

[dependencies.zeroize]
workspace = true

[dev-dependencies]
anyhow = { workspace = true }
