[package]
name = "beardog-ipc"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Local dependencies
beardog-errors = { path = "../beardog-errors" }
beardog-core = { path = "../beardog-core" }

[dev-dependencies]
tokio-test = "0.4"
tracing-test = "0.2"
rand = "0.8"

