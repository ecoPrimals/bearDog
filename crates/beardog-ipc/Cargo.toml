[package]
name = "beardog-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Inter-process communication layer for BearDog - Unix sockets, JSON-RPC"
repository = "https://github.com/ecoPrimals/beardog"
homepage.workspace = true
readme = "README.md"
keywords = ["ipc", "json-rpc", "unix-socket", "beardog"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
# BearDog core types
beardog-core = { workspace = true }
beardog-config = { workspace = true }
beardog-discovery = { workspace = true }
beardog-errors = { workspace = true }
beardog-types = { workspace = true }

# Core async runtime
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time", "fs"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# tarpc re-added (Aug 2026, Wave 156h) to beardog-tunnel under `tarpc-rpc` feature flag.
# beardog-ipc remains JSON-RPC-only (tarpc 0.37 no longer pulls async-trait).

[features]
default = []

[dev-dependencies]
rand = { workspace = true }
