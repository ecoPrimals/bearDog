[package]
name = "beardog-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Inter-process communication layer for BearDog - Unix sockets, JSON-RPC"
repository = "https://github.com/ecoPrimals/beardog"
keywords = ["ipc", "json-rpc", "unix-socket", "beardog"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# BearDog core types
beardog-core = { path = "../beardog-core" }
beardog-errors = { path = "../beardog-errors" }

# Core async runtime
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Optional: Type-safe RPC
tarpc = { version = "0.34", features = ["tokio1", "serde1"], optional = true }

[features]
default = ["json-rpc"]
json-rpc = []
tarpc = ["dep:tarpc"]

[dev-dependencies]
tokio-test = "0.4"
rand = { workspace = true }
