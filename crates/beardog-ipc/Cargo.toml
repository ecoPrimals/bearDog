[package]
name = "beardog-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Inter-process communication layer for BearDog - Unix sockets, JSON-RPC"
repository = "https://github.com/ecoPrimals/beardog"
keywords = ["ipc", "json-rpc", "unix-socket", "beardog"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
# BearDog core types
beardog-core = { path = "../beardog-core" }
beardog-config = { path = "../beardog-config" }
beardog-discovery = { path = "../beardog-discovery" }
beardog-errors = { path = "../beardog-errors" }
beardog-types = { path = "../beardog-types" }

# Core async runtime
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# tarpc removed (Jan 29, 2026) — transitively pulls async-trait; JSON-RPC provides full functionality.

[features]
default = []

[dev-dependencies]
rand = { workspace = true }
