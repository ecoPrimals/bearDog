[package]
name = "beardog-integration"
version = "0.1.0"
edition = "2021"
authors = ["ecoPrimals Team"]
description = "Songbird UPA integration layer for BearDog - enabling federated service discovery and orchestration"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/beardog"
homepage = "https://beardog.dev"
documentation = "https://docs.beardog.dev"
readme = "README.md"
keywords = ["integration", "upa", "songbird", "federation", "orchestration"]
categories = ["network-programming", "api-bindings"]

[dependencies]
# Async runtime - modern concurrent patterns
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Tower Atomic client (Pure Rust IPC via Unix sockets!)
beardog-tower-atomic = { version = "0.9.0", path = "../beardog-tower-atomic" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System metrics
sysinfo = "0.30"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"

# Synchronization primitives
parking_lot = "0.12"
arc-swap = "1.6"  # Lock-free atomic Arc swaps

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# BearDog dependencies
beardog-errors = { path = "../beardog-errors" }
beardog-tunnel = { path = "../beardog-tunnel" }
beardog-genetics = { path = "../beardog-genetics" }
beardog-types = { path = "../beardog-types" }
beardog-capabilities = { path = "../beardog-capabilities" }

# Web framework for API server
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["limit", "buffer", "timeout"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
wiremock = "0.6"

[features]
default = []
# Feature for testing without live Songbird
mock-upa = []

