[package]
name = "beardog-config"
version.workspace = true
edition = "2024"
authors = ["BearDog Team"]
description = "Configuration management for BearDog with zero hardcoding"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
readme = "../README.md"
keywords = ["config", "configuration", "beardog", "security", "hsm"]
categories = ["config", "cryptography"]

[lints]
workspace = true

[dependencies]
# Error handling
beardog-errors = { path = "../beardog-errors" }
thiserror = { workspace = true }

# Serialization formats
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Environment variables
dotenvy = "0.15"

# Path manipulation
dirs = "5.0"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Logging
tracing = { workspace = true }

# Async runtime (for async config loading if needed)
tokio = { workspace = true, optional = true, features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[features]
default = []
