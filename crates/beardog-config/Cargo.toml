[package]
name = "beardog-config"
version.workspace = true
edition = "2024"
authors = ["BearDog Team"]
description = "Configuration management for BearDog with zero hardcoding"
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/beardog"
readme = "../README.md"
keywords = ["config", "configuration", "beardog", "security", "hsm"]
categories = ["config", "cryptography"]

[lints]
workspace = true

[dependencies]
# Error handling
beardog-errors = { path = "../beardog-errors" }
thiserror = "1.0"

# Serialization formats
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
serde_yaml = "0.9"

# Environment variables
dotenvy = "0.15"

# Path manipulation
dirs = "5.0"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Logging
tracing = "0.1"

# Async runtime (for async config loading if needed)
tokio = { version = "1.0", optional = true, features = ["fs"] }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["full", "test-util"] }

[features]
default = []
async = ["tokio"]
