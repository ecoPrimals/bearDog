[package]
name = "beardog-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Configuration management for BearDog Security Manager"
repository = "https://github.com/ecoPrimals/beardog"

[dependencies]
anyhow = "1.0"
beardog-errors = { workspace = true }
serde = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
thiserror = "1.0"
config = "0.14"
dirs = "5.0"
uuid = { workspace = true }
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
num_cpus = "1.16"

# Redis and caching dependencies
redis = { version = "0.24", features = ["tokio-comp", "cluster", "streams"], optional = true }

# SIMD and crypto dependencies
aes = { version = "0.8", optional = true }
chacha20 = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
blake3 = { version = "1.5", optional = true }
argon2 = { version = "0.5", optional = true }
rand = "0.8"

# Hardware detection
raw-cpuid = { version = "11.0", optional = true }
is-terminal = "0.4"

# Compression
lz4 = { version = "1.24", optional = true }
zstd = { version = "0.13", optional = true }
brotli = { version = "3.4", optional = true }

# Serialization
rmp-serde = { version = "1.1", optional = true }  # MessagePack
prost = { version = "0.12", optional = true }     # Protocol Buffers
url = "2.5.4"

# SIMD support using built-in std::simd when available
# Note: We'll use software fallbacks for now to ensure compatibility

[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"

[features]
default = ["redis", "simd", "compression"]
redis = ["dep:redis"]
simd = ["dep:raw-cpuid"]
compression = ["dep:lz4", "dep:zstd", "dep:brotli"]
crypto = ["dep:aes", "dep:chacha20", "dep:sha2", "dep:blake3", "dep:argon2"]
serialization = ["dep:rmp-serde", "dep:prost"]
hsm = []
ml-threat-detection = []
genetic-spawning = []
compliance = []
federation = []
full = ["redis", "simd", "compression", "crypto", "serialization", "hsm", "ml-threat-detection", "genetic-spawning", "compliance", "federation"] 
