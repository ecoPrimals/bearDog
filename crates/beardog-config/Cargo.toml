[package]
name = "beardog-config"
version = "0.1.0"
edition = "2021"
authors = ["BearDog Team"]
description = "Configuration management for BearDog with zero hardcoding"
license = "MIT OR Apache-2.0"

[dependencies]
# Error handling
beardog-errors = { path = "../beardog-errors" }
thiserror = "1.0"

# Serialization formats
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
serde_yaml = "0.9"

# Environment variables
dotenvy = "0.15"

# Path manipulation
dirs = "5.0"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Logging
tracing = "0.1"

# Async runtime (for async config loading if needed)
tokio = { version = "1.0", optional = true, features = ["fs"] }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["full", "test-util"] }

[features]
default = []
async = ["tokio"]
