[package]
name = "beardog-config"
version = "0.1.0"
edition = "2021"
description = "Configuration management for BearDog Security Manager"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/beardog"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"

# Internal dependencies
beardog-errors = { path = "../beardog-errors" }

[features]
default = ["hsm", "genetic-spawning", "compliance"]
hsm = []
ml-threat-detection = []
genetic-spawning = []
compliance = []
federation = [] 