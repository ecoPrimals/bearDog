[package]
name = "beardog-tower-atomic"
version = "0.9.0"
edition = "2024"
authors = ["BearDog Team"]
description = "Tower Atomic - Unix socket-based JSON-RPC client for inter-primal communication"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
readme = "README.md"
keywords = ["ipc", "json-rpc", "unix-sockets", "inter-primal", "tower-atomic"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
beardog-types = { workspace = true }
beardog-errors = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }

[features]
default = []

