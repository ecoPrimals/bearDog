[package]
name = "beardog-types"
version = "3.0.0"
edition = "2021"
authors = ["BearDog Security Team"]
description = "Canonical type definitions for BearDog Security Manager"
license = "AGPL-3.0-only"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["types", "security", "canonical", "cryptography", "enterprise"]
categories = ["data-structures", "cryptography", "security", "development-tools", "enterprise"]
documentation = "https://docs.rs/beardog-types"

[dependencies]
# Core dependencies
beardog-errors = { path = "../beardog-errors" }

# Core serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "fs", "macros"], optional = true }

# Configuration support (optional)
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }

# Crypto support (optional)  
ring = { version = "0.17", optional = true }

# Network support (optional)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Logging
tracing = "0.1"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"

# Feature flags for optional functionality
[features]
default = ["config"]
crypto = ["ring"]
network = ["reqwest", "tokio"]
config = ["serde_yaml", "toml", "tokio"]  # Configuration loading features 