[package]
name = "beardog-types"
version = "3.0.0"
edition = "2021"
description = "Canonical type system for the BearDog distributed security ecosystem"
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/beardog"
authors = ["BearDog Team <beardog@ecoprimals.dev>"]
readme = "README.md"
keywords = ["types", "security", "distributed", "canonical", "beardog"]
categories = ["data-structures", "rust-patterns"]
documentation = "https://docs.rs/beardog-types"
rust-version = "1.75"
homepage.workspace = true

[dependencies]
# BearDog internal crates
beardog-config = { path = "../beardog-config" }

serde_json = "1.0"
thiserror = { workspace = true }
tracing = "0.1"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "fs", "macros"], optional = true }
rand = "0.8"
async-trait = "0.1"

# Safe concurrent data structures
crossbeam = "0.8"
parking_lot = "0.12"

# Modern cryptography (RustCrypto ecosystem - pure Rust, audited)
aes-gcm = "0.10"              # AES-256-GCM authenticated encryption
chacha20poly1305 = "0.10"     # ChaCha20-Poly1305 AEAD
ed25519-dalek = "2.1"         # Ed25519 signatures
getrandom = "0.2"             # OS entropy source
hkdf = "0.12"                 # HMAC-based key derivation
hmac = "0.12"                 # HMAC for message authentication
sha2 = "0.10"                 # SHA-256/512 hashing
sha3 = "0.10"                 # SHA3-256 hashing (for constraints)
zeroize = { version = "1.7", features = ["derive"] }  # Memory zeroing for keys
bincode = "1.3"               # Binary serialization for constraint hashing

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = { workspace = true }

[features]
default = [ "config",]
crypto = [ "ring",]
# REMOVED: network feature (reqwest not needed!)
# network = [ "reqwest", "tokio",]
config = [ "serde_yaml", "toml", "tokio",]

[[bench]]
name = "config_benchmarks"
harness = false

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.uuid]
version = "1.0"
features = [ "v4", "serde",]

[dependencies.serde_yaml]
version = "0.9"
optional = true

[dependencies.toml]
version = "0.8"
optional = true

[dependencies.ring]
version = "0.17"
optional = true

# REMOVED: reqwest (HTTP client not needed!)
# [dependencies.reqwest]
# version = "0.12"
# features = [ "json",]
# optional = true
