[package]
name = "beardog-types"
version.workspace = true
edition = "2024"
description = "Canonical type system for the BearDog distributed security ecosystem"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
authors = ["BearDog Team <beardog@ecoprimals.dev>"]
readme = "README.md"
keywords = ["types", "security", "distributed", "canonical", "beardog"]
categories = ["data-structures", "rust-patterns"]
documentation = "https://docs.rs/beardog-types"
rust-version = "1.93.0"
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# BearDog internal crates
beardog-config = { path = "../beardog-config" }

serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true }
rand = { workspace = true }

# Safe concurrent data structures
crossbeam = "0.8"
parking_lot = { workspace = true }

# Modern cryptography (RustCrypto ecosystem - pure Rust, audited)
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = "0.2"             # OS entropy source
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
zeroize = { workspace = true }
postcard = { workspace = true }  # Binary serialization for constraint hashing

chrono = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = { workspace = true }
criterion = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
default = [ "config",]
# Enable test utilities for external testing
test-utils = []
# REMOVED: crypto feature (ring is C-dependent, replaced by RustCrypto throughout beardog)
# crypto = [ "ring",]
# REMOVED: network feature (reqwest not needed!)
# network = [ "reqwest", "tokio",]
config = [ "toml", "tokio",]

[[bench]]
name = "config_benchmarks"
harness = false

[dependencies.beardog-errors]
path = "../beardog-errors"

# REMOVED: ring crate (Feb 4, 2026 - Deep Debt Round 10)
# ring contains C/assembly code; replaced by RustCrypto throughout beardog
# [dependencies.ring]
# version = "0.17"
# optional = true

# REMOVED: reqwest (HTTP client not needed!)
# [dependencies.reqwest]
# version = "0.12"
# features = [ "json",]
# optional = true
