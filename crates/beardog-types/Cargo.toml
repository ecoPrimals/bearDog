[package]
name = "beardog-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical type definitions for BearDog - eliminates type fragmentation across the security ecosystem"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["types", "security", "canonical", "cryptography", "enterprise"]
categories = ["data-structures", "cryptography", "security", "development-tools", "enterprise"]
documentation = "https://docs.rs/beardog-types"

[dependencies]
# Core dependencies
beardog-errors = { path = "../beardog-errors" }

# Core serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"

# Async runtime - minimal features for types
tokio = { version = "1.0", features = ["rt", "macros"], optional = true }

# Configuration support (optional)
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }

# Crypto support (optional)  
ring = { version = "0.17", optional = true }

# Network support (optional)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Random number generation for retry jitter
rand = "0.8"

# Development dependencies
[dev-dependencies]
tokio-test = "0.4"

# Feature flags for optional functionality
[features]
default = []
crypto = ["ring"]
network = ["reqwest", "tokio"]
config = ["serde_yaml", "toml", "tokio"]  # Configuration loading features 