[package]
name = "libtower"
description = "C ABI shared library for BearDog Tower Atomic crypto operations"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
homepage.workspace = true
keywords = ["cryptography", "ffi", "cdylib", "tower-atomic", "pure-rust"]
categories = ["cryptography", "api-bindings"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
deprecated = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
perf = "warn"
nursery = "warn"
missing_errors_doc = { level = "warn", priority = 1 }
unused_async = { level = "allow", priority = 1 }
unused_self = { level = "allow", priority = 1 }
unnecessary_wraps = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }

[dependencies]
beardog-crypto = { workspace = true }
beardog-errors = { workspace = true }
serde_json = { workspace = true }
