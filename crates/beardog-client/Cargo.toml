[package]
name = "beardog-client"
version = "0.9.0"
edition = "2024"
authors = ["BearDog Team"]
description = "Tower Atomic client for BearDog lineage API - Pure Rust Unix socket IPC"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
readme = "README.md"
keywords = ["beardog", "lineage", "client", "ipc", "sovereignty"]
categories = ["network-programming", "api-bindings", "cryptography"]

[lints]
workspace = true

[dependencies]
# Tower Atomic client (Pure Rust IPC via Unix sockets!)
beardog-tower-atomic = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# BearDog types
beardog-genetics = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
mockito = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
beardog-errors = { workspace = true }

