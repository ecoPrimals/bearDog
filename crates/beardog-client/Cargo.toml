[package]
name = "beardog-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Tower Atomic client for BearDog lineage API - Pure Rust Unix socket IPC"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["beardog", "lineage", "client", "ipc", "sovereignty"]
categories = ["network-programming", "api-bindings", "cryptography"]

[lints]
workspace = true

[dependencies]
# Tower Atomic client (Pure Rust IPC via Unix sockets!)
beardog-tower-atomic = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# BearDog types
beardog-genetics = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
chrono = { workspace = true }
beardog-errors = { workspace = true }

