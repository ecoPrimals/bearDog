[package]
name = "beardog-client"
version = "0.9.0"
edition = "2024"
authors = ["BearDog Team"]
description = "Tower Atomic client for BearDog lineage API - Pure Rust Unix socket IPC"
license = "AGPL-3.0-only"
repository = "https://github.com/eastgate-software/beardog"
readme = "README.md"
keywords = ["beardog", "lineage", "client", "ipc", "sovereignty"]
categories = ["network-programming", "api-bindings", "cryptography"]

[lints]
workspace = true

[dependencies]
# Tower Atomic client (Pure Rust IPC via Unix sockets!)
beardog-tower-atomic = { version = "0.9.0", path = "../beardog-tower-atomic" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# BearDog types
beardog-genetics = { version = "0.9.0", path = "../beardog-genetics" }

# Logging
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.0"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
beardog-errors = { path = "../beardog-errors" }

