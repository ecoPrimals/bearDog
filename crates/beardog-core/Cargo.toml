[package]
name = "beardog-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BearDog core module"
authors.workspace = true

[dependencies]
beardog-errors = { path = "../beardog-errors" }
beardog-security = { path = "../beardog-security" }
beardog-genetics = { path = "../beardog-genetics" }
beardog-config = { path = "../beardog-config" }
beardog-monitoring = { path = "../beardog-monitoring" }
beardog-auth = { path = "../beardog-auth" }
beardog-compliance = { path = "../beardog-compliance" }
beardog-workflows = { path = "../beardog-workflows" }
beardog-threat = { path = "../beardog-threat" }
beardog-adapters = { path = "../beardog-adapters" }

# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4.3"

