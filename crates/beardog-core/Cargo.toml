[package]
name = "beardog-core"
description = "BearDog core module"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "core", "ecosystem", "beardog", "orchestration", "management",]
categories = [ "development-tools", "ecosystem", "orchestration",]

[lints]
workspace = true

[dependencies]
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
hex = "0.4"
ed25519-dalek = "2.1"
sha2 = "0.10"
toml = "0.8"
ahash = "0.8"
async-trait = "0.1"
rand = "0.8"
urlencoding = "2.1"
hickory-resolver = "0.24"  # Replaced unmaintained trust-dns
zeroize = "1.7"
rand_chacha.workspace = true
http = "1.3.1"

[dev-dependencies]
tokio-test = "0.4.3"
tracing-subscriber = "0.3"

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[dependencies.beardog-config]
path = "../beardog-config"

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.beardog-traits]
path = "../beardog-traits"

[dependencies.beardog-security]
path = "../beardog-security"

[dependencies.beardog-genetics]
path = "../beardog-genetics"

[dependencies.beardog-monitoring]
path = "../beardog-monitoring"

[dependencies.beardog-auth]
path = "../beardog-auth"

[dependencies.beardog-compliance]
path = "../beardog-compliance"

[dependencies.beardog-threat]
path = "../beardog-threat"

[dependencies.beardog-adapters]
path = "../beardog-adapters"

[dependencies.tokio]
version = "1.0"
features = [ "full",]

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.uuid]
version = "1.0"
features = [ "v4",]

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.reqwest]
version = "0.11"
features = [ "json",]

[features]
default = []
hsm-integration = []
