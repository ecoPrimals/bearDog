[package]
name = "beardog-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BearDog core module"
authors.workspace = true

[dependencies]
beardog-errors = { path = "../beardog-errors" }
beardog-types = { path = "../beardog-types" }
beardog-traits = { path = "../beardog-traits" }
beardog-security = { path = "../beardog-security" }
beardog-genetics = { path = "../beardog-genetics" }
# beardog-config removed - use beardog-types::config::complete_unified
beardog-monitoring = { path = "../beardog-monitoring" }
beardog-auth = { path = "../beardog-auth" }
beardog-compliance = { path = "../beardog-compliance" }
beardog-threat = { path = "../beardog-threat" }
beardog-adapters = { path = "../beardog-adapters" }

# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# async-trait = "0.1"  # REMOVED: Modernized to native async fn
reqwest = { version = "0.11", features = ["json"] }
hex = "0.4"
ed25519-dalek = "2.1"
sha2 = "0.10"
toml = "0.8"
ahash = "0.8"
async-trait = "0.1"  # Still needed for some trait implementations
rand = "0.8"
rmp-serde = "1.1"
urlencoding = "2.1"

[dev-dependencies]
tokio-test = "0.4.3"

