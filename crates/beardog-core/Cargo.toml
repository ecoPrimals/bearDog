[package]
name = "beardog-core"
description = "BearDog core module"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "core", "ecosystem", "beardog", "orchestration", "management",]
categories = [ "development-tools", "ecosystem", "orchestration",]
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
toml = { workspace = true }
ahash = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
rand_chacha = { workspace = true }
http = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }
mdns-sd = { workspace = true, optional = true }
whoami = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
blake3 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
argon2 = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
approx = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }

[package.version]
workspace = true

[package.edition]
workspace = true

[package.authors]
workspace = true

[dependencies.beardog-utils]
path = "../beardog-utils"

[dependencies.beardog-config]
path = "../beardog-config"

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.beardog-traits]
path = "../beardog-traits"

[dependencies.beardog-security]
path = "../beardog-security"

[dependencies.beardog-genetics]
path = "../beardog-genetics"

[dependencies.beardog-monitoring]
path = "../beardog-monitoring"

[dependencies.beardog-auth]
path = "../beardog-auth"

[dependencies.beardog-threat]
workspace = true

[dependencies.beardog-adapters]
path = "../beardog-adapters"

[dependencies.beardog-discovery]
path = "../beardog-discovery"

[dependencies.tokio]
workspace = true
features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"]

[dependencies.serde]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.chrono]
workspace = true

[features]
default = []
hsm-integration = []
mdns = ["dep:mdns-sd"]
# AI hybrid intelligence tree — outside crypto domain per PRIMAL_RESPONSIBILITY_MATRIX.
# Feature-gated for boundary enforcement; long-term may relocate to Squirrel via biomeOS.
ai = []
