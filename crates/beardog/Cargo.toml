[package]
name = "beardog"
description = "BearDog Security Provider - Quantum-resistant cryptography and HSM integration for the ecoPrimals ecosystem"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = ["security", "cryptography", "hsm", "quantum-resistant", "ecosystem"]
categories = ["cryptography", "authentication", "hardware-support"]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[dependencies]
beardog-core = { path = "../beardog-core" }
beardog-errors = { path = "../beardog-errors" }
beardog-ipc = { path = "../beardog-ipc" }  # For neural_registration
beardog-security = { path = "../beardog-security" }
beardog-auth = { path = "../beardog-auth" }
beardog-genetics = { path = "../beardog-genetics" }
beardog-threat = { path = "../beardog-threat" }
# beardog-tunnel removed to break circular dependency
beardog-adapters = { path = "../beardog-adapters" }
beardog-compliance = { path = "../beardog-compliance" }
beardog-monitoring = { path = "../beardog-monitoring" }
beardog-node-registry = { path = "../beardog-node-registry" }
beardog-production = { path = "../beardog-production" }
beardog-utils = { path = "../beardog-utils" }
beardog-types = { path = "../beardog-types" }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
