[[bin]]
name = "beardog"
path = "src/main.rs"

[package]
name = "beardog-cli"
description = "BearDog Security Manager CLI"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.85.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "cli", "command-line", "beardog", "management", "tools",]
categories = [ "command-line-utilities", "development-tools",]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
beardog-security = { path = "../beardog-security" }
beardog-ipc = { path = "../beardog-ipc" }  # Neural API registration
chacha20poly1305 = "0.10"
hkdf = "0.12.4"
# openssl = "0.10.75"  # REMOVED: Using pure Rust crypto (RustCrypto, ring)
pbkdf2 = "0.12.2"
rpassword = "7.3"
sha2.workspace = true
whoami = "1.6.1"

[dependencies.beardog-core]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-tunnel]
path = "../beardog-tunnel"

[dependencies.tokio]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.hex]
version = "0.4"

[dependencies.sha3]
version = "0.10"

[dependencies.hostname]
version = "0.4"

[dependencies.base64]
version = "0.21"

[dependencies.rand]
version = "0.8"

[dependencies.aes-gcm]
version = "0.10"

# Pure Rust platform integrations (replacing external commands)
[dependencies.adb_client]
version = "0.8"
optional = true  # Pure Rust ADB protocol implementation

[dependencies.nusb]
version = "0.1"
optional = true  # Pure Rust USB library, no C dependencies

[dependencies.beardog-genetics]
path = "../beardog-genetics"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.async-trait]
version = "0.1"

[dependencies.blake3]
workspace = true

[dev-dependencies]
serial_test.workspace = true
tokio = { version = "1.42", features = ["full"] }
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
serde_json = "1.0"

[features]
default = ["pure-rust"]
pure-rust = ["adb_client", "nusb"]  # Use pure Rust implementations
system-commands = []  # Fallback to system commands (current temporary implementation)
