[[bin]]
name = "beardog"
path = "src/main.rs"

[package]
name = "beardog-cli"
description = "BearDog Security Manager CLI"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "cli", "command-line", "beardog", "management", "tools",]
categories = [ "command-line-utilities", "development-tools",]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[dependencies.beardog-core]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.chrono]
workspace = true
