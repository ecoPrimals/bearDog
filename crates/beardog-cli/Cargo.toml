[package]
name = "beardog-cli"
description = "BearDog Security Manager CLI"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "cli", "command-line", "beardog", "management", "tools",]
categories = [ "command-line-utilities", "development-tools",]
license = "AGPL-3.0-or-later"

[package.version]
workspace = true

[package.edition]
workspace = true

[package.authors]
workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
beardog-security = { path = "../beardog-security" }
beardog-ipc = { path = "../beardog-ipc" }  # Neural API registration
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
# openssl = "0.10.75"  # REMOVED: Using pure Rust crypto (RustCrypto, ring)
pbkdf2 = { workspace = true }
rpassword = "7.3"
sha2.workspace = true
whoami = "1.6.1"

[dependencies.beardog-core]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-tunnel]
path = "../beardog-tunnel"

[dependencies.tokio]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.hex]
workspace = true

[dependencies.sha3]
workspace = true

[dependencies.hostname]
workspace = true

[dependencies.base64]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.aes-gcm]
workspace = true

# Pure Rust platform integrations (replacing external commands)
[dependencies.adb_client]
version = "0.8"
optional = true  # Pure Rust ADB protocol implementation

[dependencies.nusb]
version = "0.1"
optional = true  # Pure Rust USB library, no C dependencies

[dependencies.beardog-genetics]
path = "../beardog-genetics"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.beardog-config]
workspace = true

[dependencies.beardog-tower-atomic]
path = "../beardog-tower-atomic"

[dependencies.async-trait]
workspace = true

[dependencies.blake3]
workspace = true

[dev-dependencies]
serial_test.workspace = true
tokio = { workspace = true }
assert_cmd = "2.0"
predicates = "3.0"
tempfile = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["pure-rust"]
pure-rust = ["adb_client", "nusb"]  # Use pure Rust implementations
system-commands = []  # Fallback to system commands (current temporary implementation)
