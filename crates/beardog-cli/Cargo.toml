[package]
name = "beardog-cli"
description = "BearDog Security Manager CLI"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "cli", "command-line", "beardog", "management", "tools",]
categories = [ "command-line-utilities", "development-tools",]
readme = "README.md"
license = "AGPL-3.0-or-later"

[package.version]
workspace = true

[package.edition]
workspace = true

[package.authors]
workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
beardog-security = { workspace = true }
beardog-acme = { workspace = true }
beardog-ipc = { workspace = true }  # Neural API registration
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
pbkdf2 = { workspace = true }
rpassword = { workspace = true }
sha2.workspace = true
whoami = { workspace = true }

[dependencies.beardog-core]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-tunnel]
workspace = true

[dependencies.rustls-rustcrypto]
workspace = true

[dependencies.tokio]
workspace = true
features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "fs"]

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.hex]
workspace = true

[dependencies.sha3]
workspace = true

[dependencies.base64]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.aes-gcm]
workspace = true

[dependencies.beardog-genetics]
workspace = true

[dependencies.beardog-types]
workspace = true

[dependencies.beardog-config]
workspace = true

[dependencies.beardog-tower-atomic]
workspace = true

[dependencies.blake3]
workspace = true

[dev-dependencies]
serial_test.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
