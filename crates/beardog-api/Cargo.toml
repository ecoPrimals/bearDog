[package]
name = "beardog-api"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "BearDog api module"
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
chrono = { workspace = true }
futures.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
bytes = "1.5"
tokio = { workspace = true }
tokio-stream = "0.1"
tower-http = { version = "0.4", features = ["trace", "cors", "compression-gzip", "timeout"] }
tracing = { workspace = true }
uuid = { workspace = true }
redis = { workspace = true }
ipnet = { workspace = true }

beardog-auth = { workspace = true }
beardog-config = { workspace = true }
beardog-core = { workspace = true }
beardog-errors = { workspace = true }
beardog-genetics = { workspace = true }
beardog-monitoring = { workspace = true }
beardog-security = { workspace = true }
beardog-tunnel = { workspace = true }
beardog-utils = { workspace = true }
beardog-threat = { workspace = true }
beardog-workflows = { workspace = true }
rand.workspace = true
lazy_static = "1.4"
num_cpus = "1.0"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
