[package]
name = "beardog-api"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/beardog"
description = "BearDog API server and handlers"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "api", "rest", "beardog", "web", "services",]
categories = [ "web-programming", "api-bindings", "development-tools",]

[features]
default = []
mdns = []

[dependencies]
base64 = "0.22"
gethostname = "0.5"
serde_json = "1.0"
tracing = "0.1"
# tarpc for high-performance binary RPC (Phase 4)
tarpc = { version = "0.34", features = ["full"] }
futures = "0.3"

[package.authors]
workspace = true

[dependencies.beardog-core]
path = "../beardog-core"

[dependencies.beardog-config]
path = "../beardog-config"

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.beardog-auth]
path = "../beardog-auth"

[dependencies.beardog-threat]
path = "../beardog-threat"

[dependencies.beardog-security]
path = "../beardog-security"

[dependencies.axum]
version = "0.7"
features = [ "macros", "json", "query", "tokio", "tracing",]

[dependencies.tower]
version = "0.4"
features = [ "full",]

[dependencies.tower-http]
version = "0.5"
features = [ "cors", "compression-gzip", "trace",]

[dependencies.tokio]
version = "1.0"
features = [ "full",]

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.uuid]
version = "1.0"
features = [ "v4", "serde",]

[dependencies.reqwest]
workspace = true  # Updated from 0.11 to workspace 0.12 with rustls-tls
features = [ "json",]

[dev-dependencies]
ed25519-dalek = "2.1"
sha2 = "0.10"
hkdf = "0.12"
