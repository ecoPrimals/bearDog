[[bin]]
name = "deploy-pixel8"
path = "src/main.rs"

[package]
name = "beardog-deploy"
version.workspace = true
edition = "2024"
description = "Pure Rust deployment tool for BearDog on Android devices"
repository = "https://github.com/ecoPrimals/beardog"
license = "AGPL-3.0-or-later"
rust-version = "1.93.0"
authors = [ "BearDog Team <team@beardog.dev>",]
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "deployment", "automation", "beardog", "orchestration", "devops",]
categories = [ "development-tools", "deployment", "automation",]
readme = "README.md"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# CLEANED: anyhow removed - using BearDogError/BearDogResult (October 2025)
thiserror = { workspace = true }
walkdir = "2.0"
serde_json = { workspace = true }
path-absolutize = "3.0"
console = "0.15"
indicatif = "0.17"
# REMOVED: sysinfo (C-dependency) - ecoBin compliance; device metadata uses env vars / adb

[dependencies.clap]
workspace = true

[dependencies.tokio]
workspace = true
features = [ "rt", "rt-multi-thread", "process", "fs", "time", "io-util", "macros",]

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.chrono]
workspace = true

[dependencies.serde]
workspace = true

[dev-dependencies]
serial_test.workspace = true
serde_json = { workspace = true }
tempfile = { workspace = true }
