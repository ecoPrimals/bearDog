[[bin]]
name = "deploy-pixel8"
path = "src/main.rs"

[package]
name = "beardog-deploy"
version.workspace = true
edition = "2024"
description = "Pure Rust deployment tool for BearDog on Android devices"
repository = "https://github.com/ecoPrimals/beardog"
license = "AGPL-3.0-or-later"
rust-version = "1.93.0"
authors = [ "BearDog Team <team@beardog.dev>",]
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "deployment", "automation", "beardog", "orchestration", "devops",]
categories = [ "development-tools",]
publish = false
readme = "README.md"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
console = { workspace = true }
[dependencies.clap]
workspace = true

[dependencies.tokio]
workspace = true
features = [ "rt", "rt-multi-thread", "process", "fs", "time", "io-util", "macros",]

[dependencies.beardog-config]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.serde]
workspace = true

[dev-dependencies]
serial_test.workspace = true
serde_json = { workspace = true }
tempfile = { workspace = true }
