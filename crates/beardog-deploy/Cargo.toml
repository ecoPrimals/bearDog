[[bin]]
name = "deploy-pixel8"
path = "src/main.rs"

[package]
name = "beardog-deploy"
version = "1.0.0"
edition = "2021"
description = "Pure Rust deployment tool for BearDog on Android devices"
repository = "https://github.com/eastgate-software/beardog"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
authors = [ "BearDog Team <team@beardog.dev>",]
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "deployment", "automation", "beardog", "orchestration", "devops",]
categories = [ "development-tools", "deployment", "automation",]
readme = "README.md"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = { workspace = true }
walkdir = "2.0"
serde_json = "1.0"
path-absolutize = "3.0"
console = "0.15"
indicatif = "0.17"
sysinfo = "0.29"

[dependencies.clap]
version = "4.0"
features = [ "derive",]

[dependencies.tokio]
version = "1.0"
features = [ "rt", "rt-multi-thread", "process", "fs", "time", "io-util", "macros",]

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.serde]
version = "1.0"
features = [ "derive",]
