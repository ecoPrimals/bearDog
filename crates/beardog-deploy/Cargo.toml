[package]
name = "beardog-deploy"
version = "1.0.0"
edition = "2021"
description = "Pure Rust deployment tool for BearDog on Android devices"

[[bin]]
name = "deploy-pixel8"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "process", "fs", "time", "io-util", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# BearDog dependencies
beardog-errors = { path = "../beardog-errors" }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File operations
walkdir = "2.0"

# Process execution - using modern tokio::process instead of deprecated tokio-process
# tokio-process = "0.2" # REMOVED: Contains vulnerable dependencies (slab 0.4.10, crossbeam-utils)
# Modern tokio already includes process support via tokio::process

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Path utilities
path-absolutize = "3.0"

# Console output
console = "0.15"
indicatif = "0.17"

# System info
sysinfo = "0.29" 