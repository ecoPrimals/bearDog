[package]
name = "beardog-installer"
version.workspace = true
edition = "2024"
authors = ["ecoPrimals Team"]
description = "Universal genomeBin installer - Pure Rust, async, platform-agnostic"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
keywords = ["installer", "security", "platform-agnostic", "genomeBin", "ecoBin"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[lints]
workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
beardog-errors = { path = "../beardog-errors" }
beardog-types = { path = "../beardog-types" }

# Platform paths (XDG-compliant)
directories = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Cryptography (checksums)
sha2 = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "beardog_installer"
path = "src/lib.rs"

[[bin]]
name = "beardog-installer"
path = "src/main.rs"
