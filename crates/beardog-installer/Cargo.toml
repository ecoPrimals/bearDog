[package]
name = "beardog-installer"
version.workspace = true
edition = "2021"
authors = ["ecoPrimals Team"]
description = "Universal genomeBin installer - Pure Rust, async, platform-agnostic"
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/bearDog"
keywords = ["installer", "security", "platform-agnostic", "genomeBin", "ecoBin"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[lints]
workspace = true

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Platform paths (XDG-compliant)
directories = "5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Cryptography (checksums)
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[lib]
name = "beardog_installer"
path = "src/lib.rs"

[[bin]]
name = "beardog-installer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
