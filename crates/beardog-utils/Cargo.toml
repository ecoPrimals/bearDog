[package]
name = "beardog-utils"
version = "0.1.0"
edition = "2021"
description = "Utility functions for BearDog Security Manager"
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/beardog"

[dependencies]
beardog-errors = { path = "../beardog-errors" }
beardog-types = { path = "../beardog-types" }

# Async runtime - optimized features for utilities
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "fs", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Logging and tracing
tracing = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# High-performance locking
parking_lot = "0.12"
rand.workspace = true
