[package]
name = "beardog-utils"
version.workspace = true
edition = "2024"
description = "Utility functions for BearDog Security Manager"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
authors = [ "BearDog Team <team@beardog.dev>",]
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "utilities", "helpers", "beardog", "ecosystem", "tools",]
categories = [ "development-tools", "data-structures", "algorithms",]

[lints]
workspace = true

[dependencies]
aes = { workspace = true }
ctr = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
beardog-errors = { workspace = true }
beardog-types = { workspace = true }

# Safe concurrent data structures
dashmap = { workspace = true }
crossbeam = { workspace = true }

[features]
test-utils = []

[dev-dependencies]
futures = { workspace = true }
serial_test = { workspace = true }