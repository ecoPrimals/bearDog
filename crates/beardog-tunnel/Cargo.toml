[package]
name = "beardog-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BearDog tunnel module"
authors.workspace = true

[dependencies]
beardog-errors = { workspace = true }
beardog-config = { workspace = true }
beardog-security = { workspace = true }
beardog-genetics = { workspace = true }
beardog-utils = { workspace = true }
beardog-threat = { workspace = true }
beardog-auth = { workspace = true }
tokio = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
chrono = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = { workspace = true }
rand = "0.8"
hex = "0.4"
ed25519-dalek = "2.0"
openssl = "0.10"
rayon = "1.8"
regex = "1.10"
ring = "0.16"
arrayref = "0.3"

# Android-specific dependencies
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.8", optional = true }
ndk-context = "0.1"
android_logger = { version = "0.13", optional = true }

[features]
default = []
android-hsm = ["ndk", "android_logger"]
