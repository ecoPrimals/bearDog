[package]
name = "beardog-tunnel"
description = "BearDog tunnel module"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "tunnel", "secure", "communication", "beardog", "networking",]
categories = [ "network-programming", "security", "development-tools",]

[dependencies]
# BearDog internal crates
beardog-config = { path = "../beardog-config" }
beardog-errors = { path = "../beardog-errors" }
beardog-genetics = { path = "../beardog-genetics" }
beardog-types = { path = "../beardog-types" }
beardog-capabilities = { path = "../beardog-capabilities" }
beardog-security = { path = "../beardog-security" }
beardog-monitoring = { path = "../beardog-monitoring" }
beardog-auth = { path = "../beardog-auth" }
beardog-threat = { path = "../beardog-threat" }
beardog-core = { path = "../beardog-core" }
beardog-utils = { path = "../beardog-utils" }
beardog-traits = { path = "../beardog-traits" }

# External dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }  # UniBin architecture (ecosystem standard)
hostname = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TLS support for mTLS
rustls = { version = "0.21", features = ["dangerous_configuration"] }
tokio-rustls = "0.24"
rustls-pemfile = "1.0"
webpki-roots = "0.25"
rustls-native-certs = "0.6"
tarpc = { version = "0.34", features = ["full"] }
tokio-serde = { version = "0.8", features = ["json"] }
reqwest = { workspace = true }  # Now uses rustls-tls (pure Rust!)
tokio-tungstenite = "0.20"
serde_json = "1.0"
anyhow = "1.0"  # Required for Unix socket IPC
tracing = "0.1"
thiserror = { workspace = true }
# CLEANED: anyhow removed - unused dependency (October 2025)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.0"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = "0.16"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }  # Pure Rust CSRNG for genetic crypto
sha2 = "0.10"
sha3 = "0.10"  # For entropy mixing (evolved from mock)
hmac = "0.12"  # Pure Rust HMAC for genetic crypto
blake3 = "1.0"
argon2 = "0.5"
# openssl = "0.10"  # REMOVED: Using 100% pure Rust crypto (RustCrypto)
# ring = "0.17"  # REMOVED (Jan 16, 2026): Evolved to RustCrypto (100% Pure Rust!)
hex = "0.4"
hkdf = "0.12"
arrayref = "0.3"
bincode = "1.3"
cryptoki = "0.6"
zeroize = "1.7"
parking_lot = "0.12"
async-trait = "0.1"

# Solo V2 USB security key support
ctap-hid-fido2 = { version = "3.5", optional = true }
hidapi = { version = "2.4", optional = true }

# BTSP HTTP API dependencies (DEPRECATED - evolved to Unix socket JSON-RPC!)
# axum = { version = "0.7", optional = true }  # REMOVED: BTSP now uses Unix sockets
# tower = { version = "0.4", optional = true }  # REMOVED: BTSP now uses Unix sockets  
# tower-http = { version = "0.5", features = ["trace", "cors"], optional = true }  # REMOVED
base64 = "0.21"  # Required for Unix socket IPC

[dev-dependencies]
tokio-test = "0.4"
futures = "0.3"
rand = "0.8"
serial_test = "3.0"
tempfile = "3.8"

[features]
zero-cost-architecture = []
universal-discovery = []
primal-sovereignty = []
solo-v2 = ["ctap-hid-fido2", "hidapi"]
usb-discovery = ["hidapi"]
ctap2 = ["ctap-hid-fido2"]
ecosystem = []
# btsp-api = ["axum", "tower", "tower-http"]  # DEPRECATED: BTSP evolved to Unix socket JSON-RPC
default = []
android_native = []
pixel8_optimizations = [ "android_native",]
strongbox_hardware = [ "android_native",]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[target."cfg(target_os = \"android\")".dependencies]
ndk = "0.8"
ndk-sys = "0.5"
jni = "0.21"

[target."cfg(target_os = \"ios\")".dependencies]
security-framework = "2.9"
security-framework-sys = "2.9"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[[bin]]
name = "beardog"  # UniBin architecture (ecosystem standard v1.0.0)
path = "src/main.rs"
