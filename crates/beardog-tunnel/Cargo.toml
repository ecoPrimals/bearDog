[package]
name = "beardog-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BearDog tunnel module"
authors.workspace = true

[dependencies]
beardog-errors = { path = "../beardog-errors" }
beardog-security = { path = "../beardog-security" }
beardog-genetics = { path = "../beardog-genetics" }
# beardog-config removed - use beardog-types::config::complete_unified
beardog-monitoring = { path = "../beardog-monitoring" }
beardog-auth = { path = "../beardog-auth" }
beardog-threat = { path = "../beardog-threat" }
beardog-core = { path = "../beardog-core" }
beardog-utils = { path = "../beardog-utils" }
beardog-types = { path = "../beardog-types" }

# Core dependencies
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# async-trait = "0.1"  # REMOVED: Modernized to native async fn
thiserror = "1.0"
anyhow = "1.0"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.0"
rand = "0.8"
sha2 = "0.10"
blake3 = "1.0"
argon2 = "0.5"
openssl = "0.10"
ring = "0.17"
hex = "0.4"
hkdf = "0.12"
arrayref = "0.3"

# Serialization
bincode = "1.3"

# Networking
tarpc = { version = "0.34", features = ["full"] }
tokio-serde = { version = "0.8", features = ["json"] }
reqwest = { version = "0.11", features = ["json"] }

# HSM Integration - Real hardware support
cryptoki = "0.6"

# Android integration (conditional)
[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.8"
ndk-sys = "0.5"
jni = "0.21"

# iOS integration (conditional)  
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "2.9"
security-framework-sys = "2.9"
core-foundation = "0.9"
core-foundation-sys = "0.8"

# Development dependencies
[dev-dependencies]
tokio-test = "0.4"
futures = "0.3"
rand = "0.8"

[features]
default = []
android_native = []  # Android dependencies are now always available on Android targets
pixel8_optimizations = ["android_native"]
strongbox_hardware = ["android_native"]
# Note: Android and iOS dependencies are now always available when building for those platforms
