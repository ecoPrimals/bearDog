[package]
name = "beardog-tunnel"
description = "BearDog tunnel module"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "tunnel", "secure", "communication", "beardog", "networking",]
readme = "README.md"
categories = [ "network-programming", "development-tools",]
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
# BearDog internal crates
beardog-config = { workspace = true }
beardog-crypto = { workspace = true }
beardog-errors = { workspace = true }
beardog-genetics = { workspace = true }
beardog-types = { workspace = true }
beardog-capabilities = { workspace = true }
beardog-security = { workspace = true }
beardog-monitoring = { workspace = true }
beardog-auth = { workspace = true }
beardog-threat = { workspace = true }
beardog-core = { workspace = true }
beardog-utils = { workspace = true }
beardog-traits = { workspace = true }
beardog-ipc = { workspace = true }  # Songbird IPC client (Primal IPC Protocol)

# External dependencies
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
chacha20 = { workspace = true }  # ChaCha20 counter mode for Tor cell encryption
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "ecdh", "pem"] }  # ECDSA + ECDH for TLS 1.3
p384 = { workspace = true, features = ["ecdsa", "ecdh"] }  # ECDSA + ECDH P-384 (Phase 6 - TLS 1.3)
# p521 removed: rand_core version conflict, < 1% usage, will add when stable
# ed448-goldilocks removed: handlers are stubs, crate unused — re-add when Phase 3 activates
rsa = { workspace = true }  # RSA signatures (Phase 4 - TLS 1.3 legacy)
ecdsa = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }  # Pure Rust CSRNG for genetic crypto
sha2 = { workspace = true, features = ["oid"] }  # OID support for RSA PKCS#1 v1.5
sha3 = { workspace = true }  # For entropy mixing (evolved from mock)
x25519-dalek = { workspace = true, features = ["static_secrets"] }  # Pure Rust X25519 for TLS key exchange (Songbird support)
hmac = { workspace = true }  # Pure Rust HMAC for genetic crypto
blake3 = { workspace = true }  # Pure Rust (no C assembly) for universal portability
argon2 = { workspace = true }  # Modern password hashing (OWASP recommended, Phase 6)
pbkdf2 = { workspace = true }  # Legacy password hashing (Phase 6)
# Phase 7 dependencies - High-Priority Compatibility
bcrypt = { workspace = true }  # Legacy password hashing
scrypt = { workspace = true }  # Memory-hard KDF (aligned with workspace 0.11)
sha1 = { workspace = true }             # Legacy hashing (Git compatibility)
# DEFERRED Phase 7: AES legacy modes — see root Cargo.toml [workspace.dependencies]
hex = { workspace = true }
bytes = { workspace = true }
hkdf = { workspace = true }  # HKDF key derivation for TLS 1.3
x509-parser = { workspace = true, optional = true }  # Pure Rust X.509 certificate parsing for TLS
x509-cert = { workspace = true }  # PKCS#10 CSR builder for ACME Phase 2 (songBird delegation)
postcard = { workspace = true }
zeroize = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
subtle = { workspace = true }  # Constant-time comparisons for Dark Forest challenge-response

# Pure Rust HID implementation (ecoBin compliant — no C dependencies)
beardog-hid = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }

base64 = { workspace = true }  # Aligned with workspace version (0.21 → 0.22 upgrade eliminates dep duplication)
data-encoding = { workspace = true }  # Base32 encoding for Tor v3 onion addresses
bs58 = { workspace = true }  # Base58 encoding for did:key derivation
etcetera = { workspace = true }

# Cephalization (G64): tarpc binary RPC on .tarpc.sock sibling
tarpc = { workspace = true, optional = true }

# TLS termination (H2-10 sovereignty — feature-gated)
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
rustls-rustcrypto = { workspace = true, optional = true }


[dev-dependencies]
futures = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[features]
# Production diagnostics (FOSSIL RECORD principle - preserved, not removed)
# Enable verbose crypto debugging: cargo build --features diagnostics
diagnostics = []

# Placeholder HSM backends — reserved for external hardware integrations.
# TPM and PKCS#11 are platform / vendor hardware concerns; bearDog gates stub providers
# behind these flags until optional native bindings are linked. Enable when wiring real
# TPM 2.0 (tss-esapi) or PKCS#11 library integration:
#   cargo build -p beardog-tunnel --features tpm-provider
#   cargo build -p beardog-tunnel --features pkcs11-provider
tpm-provider = []
pkcs11-provider = []

# Architecture features (reserved for future wiring)
# zero-cost-architecture, universal-discovery, primal-sovereignty removed:
# no cfg(feature) gates existed in source -- dead flags per audit.

# Hardware features (evolved to Pure Rust - ecoBin compliant)
# `solo-v2`: Solo V2 module + pure CTAP2 CBOR logic (testable without hardware).
# `ctap2`: enables HID transport (`hid_transport`) and full async CTAP2 device path; implies `beardog-hid`.
# `usb-discovery`: HID enumeration for discovery (optional; uses `beardog-hid`).
solo-v2 = ["dep:ciborium"]
usb-discovery = ["dep:beardog-hid"]
ctap2 = ["solo-v2", "dep:beardog-hid", "beardog-security/fido2"]
tls-x509 = ["dep:x509-parser"]
tls-server = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:rustls-rustcrypto"]

# Cephalization (G64): tarpc binary RPC — high-perf sibling socket for crypto hot-path
tarpc-rpc = ["dep:tarpc"]

# Platform features
# `ecosystem` removed: no cfg(feature) gate existed in source — dead flag.
# `android_native` removed: emitted by build.rs on Android targets but
# never checked via cfg(feature) in Rust source — dead flag.
default = ["tls-x509"]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.authors]
workspace = true

# Platform-specific FFI: Android/iOS dependencies fall outside ecoBin scope.
# ecoBin covers cross-platform Unix/Linux/WASM builds; mobile platform support is a separate concern.
[target."cfg(target_os = \"android\")".dependencies]
ndk = "0.8"
ndk-sys = "0.5"

# Platform-specific FFI: iOS dependencies fall outside ecoBin scope.
[target."cfg(target_os = \"ios\")".dependencies]
security-framework = "2.9"
security-framework-sys = "2.9"
core-foundation = "0.9"
core-foundation-sys = "0.8"


