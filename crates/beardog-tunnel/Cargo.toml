[package]
name = "beardog-tunnel"
description = "BearDog tunnel module"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "tunnel", "secure", "communication", "beardog", "networking",]
categories = [ "network-programming", "security", "development-tools",]

[dependencies]
# BearDog internal crates
beardog = { path = "../beardog" }
beardog-config = { path = "../beardog-config" }
beardog-errors = { path = "../beardog-errors" }
beardog-genetics = { path = "../beardog-genetics" }
beardog-types = { path = "../beardog-types" }
beardog-capabilities = { path = "../beardog-capabilities" }
beardog-security = { path = "../beardog-security" }
beardog-monitoring = { path = "../beardog-monitoring" }
beardog-auth = { path = "../beardog-auth" }
beardog-threat = { path = "../beardog-threat" }
beardog-core = { path = "../beardog-core" }
beardog-utils = { path = "../beardog-utils" }
beardog-traits = { path = "../beardog-traits" }
beardog-ipc = { path = "../beardog-ipc" }  # Songbird IPC client (Primal IPC Protocol)

# External dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }  # UniBin architecture (ecosystem standard)
hostname = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.19"  # Module-level lazy statics (graph security CollaborationService)

# tarpc removed (Jan 29, 2026) - see TARPC_REMOVAL_RATIONALE_JAN_29_2026.md
# JSON-RPC provides comprehensive functionality (8+ handler modules)
tokio-serde = { version = "0.8", features = ["json"] }
tokio-tungstenite = "0.20"
serde_json = "1.0"
anyhow = "1.0"  # Required for Unix socket IPC
tracing = "0.1"
thiserror = { workspace = true }
# CLEANED: anyhow removed - unused dependency (October 2025)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.0"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem"] }  # ECDSA + ECDH for TLS 1.3
p384 = { version = "0.13", features = ["ecdsa", "ecdh"] }  # ECDSA + ECDH P-384 (Phase 6 - TLS 1.3)
# p521 removed: rand_core version conflict, < 1% usage, will add when stable
ed448-goldilocks = "0.9"  # Ed448 signatures (Phase 3 - TLS 1.3)
rsa = "0.9"  # RSA signatures (Phase 4 - TLS 1.3 legacy)
ecdsa = "0.16"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }  # Pure Rust CSRNG for genetic crypto
sha2 = { version = "0.10", features = ["oid"] }  # OID support for RSA PKCS#1 v1.5
sha3 = "0.10"  # For entropy mixing (evolved from mock)
x25519-dalek = { version = "2.0", features = ["static_secrets"] }  # Pure Rust X25519 for TLS key exchange (Songbird support)
hmac = "0.12"  # Pure Rust HMAC for genetic crypto
blake3 = { version = "1.5", features = ["pure"] }  # Pure Rust (no C assembly) for universal portability
argon2 = "0.5"  # Modern password hashing (OWASP recommended, Phase 6)
pbkdf2 = { version = "0.12", features = ["simple"] }  # Legacy password hashing (Phase 6)
# Phase 7 dependencies - High-Priority Compatibility
bcrypt = "0.18"  # Legacy password hashing
scrypt = "0.12.0-rc.9"    # Memory-hard KDF
sha1 = "0.10"             # Legacy hashing (Git compatibility)
# DEFERRED Phase 7: AES legacy modes (like P-521/Ed448) - RC version conflicts
# aes = "0.9.0-rc.2"        # AES cipher (for CBC/CTR/XTS modes)
# cipher = "0.5.0-rc.5"     # Cipher traits (for AES modes)
# cbc = "0.2.0-rc.2"        # AES-CBC mode (TLS 1.2)
# ctr = "0.10.0-rc.2"       # AES-CTR mode (streaming)
# xts-mode = "0.5.1"        # AES-XTS mode (disk encryption)
hex = "0.4"
hkdf = "0.12"  # HKDF key derivation for TLS 1.3
x509-parser = "0.16"  # Pure Rust X.509 certificate parsing for TLS
arrayref = "0.3"
bincode = "1.3"
zeroize = "1.7"
parking_lot = "0.12"
async-trait = "0.1"
subtle = "2.5"  # Constant-time comparisons for Dark Forest challenge-response

# Solo V2 USB security key support
ctap-hid-fido2 = { version = "3.5", optional = true }
# NOTE: hidapi removed - evolved to Pure Rust beardog-hid (ecoBin compliant)
# hidapi = { version = "2.4", optional = true }

# Pure Rust HID implementation (ecoBin compliant - no C dependencies)
beardog-hid = { path = "../beardog-hid", optional = true }

base64 = "0.21"  # Required for Unix socket IPC (evolved from HTTP to pure IPC)

# DEFERRED Phase 7: AES legacy modes - RustCrypto RC version conflicts (like P-521/Ed448)
# These dependencies were added for Phase 7 but deferred due to RC version incompatibilities.
# The code architecture is complete (~700 lines) and ready to activate when crates stabilize.
# aes = "0.9.0-rc.2"        # AES cipher (for CBC/CTR/XTS modes)
# cipher = "0.5.0-rc.5"     # Cipher traits (for AES modes)
# cbc = "0.2.0-rc.2"        # AES-CBC mode (TLS 1.2)
# ctr = "0.10.0-rc.2"       # AES-CTR mode (streaming)
# xts-mode = "0.5.1"        # AES-XTS mode (disk encryption)

[dev-dependencies]
tokio-test = "0.4"
futures = "0.3"
rand = "0.8"
serial_test = "3.0"
tempfile = "3.8"

[features]
# Production diagnostics (FOSSIL RECORD principle - preserved, not removed)
# Enable verbose crypto debugging: cargo build --features diagnostics
diagnostics = []

# Architecture features
zero-cost-architecture = []
universal-discovery = []
primal-sovereignty = []

# Hardware features (evolved to Pure Rust - ecoBin compliant)
solo-v2 = ["ctap-hid-fido2", "beardog-hid"]
usb-discovery = ["beardog-hid"]
ctap2 = ["ctap-hid-fido2"]

# Platform features
ecosystem = []
default = []
android_native = []
pixel8_optimizations = [ "android_native",]
strongbox_hardware = [ "android_native",]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[target."cfg(target_os = \"android\")".dependencies]
ndk = "0.8"
ndk-sys = "0.5"
jni = "0.21"

[target."cfg(target_os = \"ios\")".dependencies]
security-framework = "2.9"
security-framework-sys = "2.9"
core-foundation = "0.9"
core-foundation-sys = "0.8"

# [[bin]]
# name = "beardog"  # REMOVED: Duplicate UniBin violation!
# path = "src/main.rs"
# 
# EVOLUTION (Feb 1, 2026): beardog-tunnel is now a LIBRARY ONLY
# The TRUE UniBin is in beardog-cli (full functionality)
# This ensures ONE binary with ALL functionality (UniBin compliant)
