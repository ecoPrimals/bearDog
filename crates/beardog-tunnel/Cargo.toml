[package]
name = "beardog-tunnel"
description = "BearDog tunnel module"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "tunnel", "secure", "communication", "beardog", "networking",]
categories = [ "network-programming", "security", "development-tools",]

[dependencies]
tokio-tungstenite = "0.20"
serde_json = "1.0"
tracing = "0.1"
thiserror = { workspace = true }
# CLEANED: anyhow removed - unused dependency (October 2025)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.0"
rand = "0.8"
sha2 = "0.10"
blake3 = "1.0"
argon2 = "0.5"
openssl = "0.10"
ring = "0.17"
hex = "0.4"
hkdf = "0.12"
arrayref = "0.3"
bincode = "1.3"
cryptoki = "0.6"

[dev-dependencies]
tokio-test = "0.4"
futures = "0.3"
rand = "0.8"

[features]
zero-cost-architecture = []
universal-discovery = []
primal-sovereignty = []
ecosystem = []
default = []
android_native = []
pixel8_optimizations = [ "android_native",]
strongbox_hardware = [ "android_native",]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.beardog-security]
path = "../beardog-security"

[dependencies.beardog-genetics]
path = "../beardog-genetics"

[dependencies.beardog-monitoring]
path = "../beardog-monitoring"

[dependencies.beardog-auth]
path = "../beardog-auth"

[dependencies.beardog-threat]
path = "../beardog-threat"

[dependencies.beardog-core]
path = "../beardog-core"

[dependencies.beardog-utils]
path = "../beardog-utils"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.tokio]
version = "1.0"
features = [ "full",]

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.uuid]
version = "1.0"
features = [ "v4",]

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.tarpc]
version = "0.34"
features = [ "full",]

[dependencies.tokio-serde]
version = "0.8"
features = [ "json",]

[dependencies.reqwest]
version = "0.11"
features = [ "json",]

[target."cfg(target_os = \"android\")".dependencies]
ndk = "0.8"
ndk-sys = "0.5"
jni = "0.21"

[target."cfg(target_os = \"ios\")".dependencies]
security-framework = "2.9"
security-framework-sys = "2.9"
core-foundation = "0.9"
core-foundation-sys = "0.8"
