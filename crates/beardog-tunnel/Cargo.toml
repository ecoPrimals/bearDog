[package]
name = "beardog-tunnel"
description = "BearDog tunnel module"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "tunnel", "secure", "communication", "beardog", "networking",]
categories = [ "network-programming", "security", "development-tools",]
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
# BearDog internal crates
beardog-config = { path = "../beardog-config" }
beardog-errors = { path = "../beardog-errors" }
beardog-genetics = { path = "../beardog-genetics" }
beardog-types = { path = "../beardog-types" }
beardog-capabilities = { path = "../beardog-capabilities" }
beardog-security = { path = "../beardog-security" }
beardog-monitoring = { path = "../beardog-monitoring" }
beardog-auth = { path = "../beardog-auth" }
beardog-threat = { path = "../beardog-threat" }
beardog-core = { path = "../beardog-core" }
beardog-utils = { path = "../beardog-utils" }
beardog-traits = { path = "../beardog-traits" }
beardog-ipc = { path = "../beardog-ipc" }  # Songbird IPC client (Primal IPC Protocol)

# External dependencies
tokio = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }  # UniBin architecture (ecosystem standard)
hostname = { workspace = true }
tracing-subscriber = { workspace = true }
# tarpc removed (Jan 29, 2026) - see TARPC_REMOVAL_RATIONALE_JAN_29_2026.md
# JSON-RPC provides comprehensive functionality (8+ handler modules)
tokio-serde = { version = "0.8", features = ["json"] }
tokio-tungstenite = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
chacha20 = { workspace = true }  # ChaCha20 counter mode for Tor cell encryption
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "ecdh", "pem"] }  # ECDSA + ECDH for TLS 1.3
p384 = { workspace = true, features = ["ecdsa", "ecdh"] }  # ECDSA + ECDH P-384 (Phase 6 - TLS 1.3)
# p521 removed: rand_core version conflict, < 1% usage, will add when stable
ed448-goldilocks = { workspace = true }  # Ed448 signatures (Phase 3 - TLS 1.3)
rsa = { workspace = true }  # RSA signatures (Phase 4 - TLS 1.3 legacy)
ecdsa = "0.16"
rand = { workspace = true }
rand_core = { workspace = true }  # Pure Rust CSRNG for genetic crypto
sha2 = { workspace = true, features = ["oid"] }  # OID support for RSA PKCS#1 v1.5
sha3 = { workspace = true }  # For entropy mixing (evolved from mock)
x25519-dalek = { workspace = true, features = ["static_secrets"] }  # Pure Rust X25519 for TLS key exchange (Songbird support)
hmac = { workspace = true }  # Pure Rust HMAC for genetic crypto
blake3 = { workspace = true }  # Pure Rust (no C assembly) for universal portability
argon2 = { workspace = true }  # Modern password hashing (OWASP recommended, Phase 6)
pbkdf2 = { workspace = true }  # Legacy password hashing (Phase 6)
# Phase 7 dependencies - High-Priority Compatibility
bcrypt = { workspace = true }  # Legacy password hashing
scrypt = { workspace = true }  # Memory-hard KDF (aligned with workspace 0.11)
sha1 = { workspace = true }             # Legacy hashing (Git compatibility)
# DEFERRED Phase 7: AES legacy modes (like P-521/Ed448) - RC version conflicts
# aes = "0.9.0-rc.2"        # AES cipher (for CBC/CTR/XTS modes)
# cipher = "0.5.0-rc.5"     # Cipher traits (for AES modes)
# cbc = "0.2.0-rc.2"        # AES-CBC mode (TLS 1.2)
# ctr = "0.10.0-rc.2"       # AES-CTR mode (streaming)
# xts-mode = "0.5.1"        # AES-XTS mode (disk encryption)
hex = { workspace = true }
bytes = { workspace = true }
hkdf = { workspace = true }  # HKDF key derivation for TLS 1.3
x509-parser = "0.16"  # Pure Rust X.509 certificate parsing for TLS
arrayref = "0.3"
postcard = { workspace = true }
zeroize = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
subtle = { workspace = true }  # Constant-time comparisons for Dark Forest challenge-response

# Solo V2 USB security key support
# REMOVED: ctap-hid-fido2 - replaced by beardog-hid (pure Rust, ecoBin compliant)
# REMOVED: hidapi - replaced by beardog-hid (pure Rust, no C dependencies)

# Pure Rust HID implementation (ecoBin compliant - no C dependencies)
beardog-hid = { path = "../beardog-hid", optional = true }
ciborium = { workspace = true, optional = true }

base64 = { workspace = true }  # Aligned with workspace version (0.21 → 0.22 upgrade eliminates dep duplication)
data-encoding = "2.5"  # Base32 encoding for Tor v3 onion addresses (Feb 7, 2026)

# DEFERRED Phase 7: AES legacy modes - RustCrypto RC version conflicts (like P-521/Ed448)
# These dependencies were added for Phase 7 but deferred due to RC version incompatibilities.
# The code architecture is complete (~700 lines) and ready to activate when crates stabilize.
# aes = "0.9.0-rc.2"        # AES cipher (for CBC/CTR/XTS modes)
# cipher = "0.5.0-rc.5"     # Cipher traits (for AES modes)
# cbc = "0.2.0-rc.2"        # AES-CBC mode (TLS 1.2)
# ctr = "0.10.0-rc.2"       # AES-CTR mode (streaming)
# xts-mode = "0.5.1"        # AES-XTS mode (disk encryption)

[dev-dependencies]
tokio-test = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[features]
# Production diagnostics (FOSSIL RECORD principle - preserved, not removed)
# Enable verbose crypto debugging: cargo build --features diagnostics
diagnostics = []

# Placeholder HSM backends — enable when wiring real TPM / PKCS#11 integrations
tpm-provider = []
pkcs11-provider = []

# Architecture features (reserved for future wiring)
# zero-cost-architecture, universal-discovery, primal-sovereignty removed:
# no cfg(feature) gates existed in source -- dead flags per audit.

# Hardware features (evolved to Pure Rust - ecoBin compliant)
# `solo-v2`: Solo V2 module + pure CTAP2 CBOR logic (testable without hardware).
# `ctap2`: enables HID transport (`hid_transport`) and full async CTAP2 device path; implies `beardog-hid`.
# `usb-discovery`: HID enumeration for discovery (optional; uses `beardog-hid`).
solo-v2 = ["dep:ciborium"]
usb-discovery = ["dep:beardog-hid"]
ctap2 = ["solo-v2", "dep:beardog-hid"]

# Platform features
# `ecosystem` removed: no cfg(feature) gate existed in source -- dead flag.
default = []
android_native = []

[package.version]
workspace = true

[package.edition]
workspace = true

[package.authors]
workspace = true

# Platform-specific FFI: Android/iOS dependencies fall outside ecoBin scope.
# ecoBin covers cross-platform Unix/Linux/WASM builds; mobile platform support is a separate concern.
[target."cfg(target_os = \"android\")".dependencies]
ndk = "0.8"
ndk-sys = "0.5"
jni = { workspace = true }

# Platform-specific FFI: iOS dependencies fall outside ecoBin scope.
[target."cfg(target_os = \"ios\")".dependencies]
security-framework = "2.9"
security-framework-sys = "2.9"
core-foundation = "0.9"
core-foundation-sys = "0.8"

# [[bin]]
# name = "beardog"  # REMOVED: Duplicate UniBin violation!
# path = "src/main.rs"
# 
# EVOLUTION (Feb 1, 2026): beardog-tunnel is now a LIBRARY ONLY
# The TRUE UniBin is in beardog-cli (full functionality)
# This ensures ONE binary with ALL functionality (UniBin compliant)
