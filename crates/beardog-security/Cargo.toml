[package]
name = "beardog-security"
version.workspace = true
edition = "2024"
description = "Security and cryptography for BearDog Security Manager"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
authors = [ "BearDog Team <team@beardog.dev>",]
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "security", "crypto", "beardog", "encryption", "hsm",]
categories = [ "cryptography", "security", "development-tools",]

[lints]
workspace = true

[dependencies]
aes-gcm = { workspace = true }
argon2 = { workspace = true }
blake3 = { workspace = true }  # Pure Rust (no C assembly) for universal portability
chacha20poly1305 = { workspace = true }
chacha20 = { workspace = true }
ed25519-dalek = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }
tokio-stream = { workspace = true }
thiserror = { workspace = true }

[dependencies.anyhow]
workspace = true

[dependencies.base64]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-types]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.futures]
workspace = true

[dependencies.hex]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.rand_core]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.beardog-threat]
path = "../beardog-threat"

[dependencies.beardog-workflows]
path = "../beardog-workflows"

[dependencies.beardog-compliance]
path = "../beardog-compliance"

[dependencies.beardog-traits]
path = "../beardog-traits"

# FIDO2-specific dependencies (Pure Rust - ecoBin compliant)
[dependencies.beardog-hid]
path = "../beardog-hid"
optional = true

[dependencies.ciborium]
workspace = true
optional = true

[dependencies.base64-url]
version = "3.0"
optional = true

# Android-specific dependencies (target-conditional)
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
fido2 = ["dep:beardog-hid", "dep:ciborium", "dep:base64-url"]
