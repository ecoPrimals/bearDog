[package]
name = "beardog-security"
version = "0.1.0"
edition = "2021"
description = "Security and cryptography for BearDog Security Manager"
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/beardog"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
beardog-errors = { workspace = true }
beardog-types = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Cryptographic dependencies
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
chacha20 = "0.9"  # For SIMD ChaCha20 implementation
ed25519-dalek = "2.0"
hmac = "0.12"
pbkdf2 = "0.12"
ring = "0.17"
rsa = "0.9"
sha2 = "0.10"  # For SIMD SHA-256 implementation
sha3 = "0.10"

# SIMD acceleration dependencies
subtle = "2.5"  # Constant-time operations
zeroize = "1.7"  # Secure memory clearing

# Zero-copy optimization dependencies
bytes = "1.5"
tempfile = "3.8"

# Async streaming dependencies for tRPC integration
tokio-stream = "0.1"

# Internal dependencies
# beardog-errors already included above
# beardog-config removed - use beardog-types::config::complete_unified
beardog-threat = { path = "../beardog-threat" }
beardog-workflows = { path = "../beardog-workflows" }
beardog-compliance = { path = "../beardog-compliance" } 