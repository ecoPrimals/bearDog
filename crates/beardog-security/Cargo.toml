[package]
name = "beardog-security"
version.workspace = true
edition = "2024"
description = "Security and cryptography for BearDog Security Manager"
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.85.0"
authors = [ "BearDog Team <team@beardog.dev>",]
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "security", "crypto", "beardog", "encryption", "hsm",]
categories = [ "cryptography", "security", "development-tools",]

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
blake3 = { version = "1.5", features = ["pure"] }  # Pure Rust (no C assembly) for universal portability
chacha20poly1305 = "0.10"
chacha20 = "0.9"
ed25519-dalek = "2.0"
hmac = "0.12"
pbkdf2 = "0.12"
rsa = "0.9.8"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2.5"
zeroize = "1.7"
bytes = "1.5"
tempfile = "3.8"
tokio-stream = "0.1"
thiserror = "2.0"

[dependencies.anyhow]
workspace = true

[dependencies.base64]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-types]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.futures]
workspace = true

[dependencies.hex]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.beardog-threat]
path = "../beardog-threat"

[dependencies.beardog-workflows]
path = "../beardog-workflows"

[dependencies.beardog-compliance]
path = "../beardog-compliance"

[dependencies.beardog-traits]
path = "../beardog-traits"

# FIDO2-specific dependencies (Pure Rust - ecoBin compliant)
[dependencies.beardog-hid]
path = "../beardog-hid"
optional = true

[dependencies.ciborium]
version = "0.2"
optional = true

[dependencies.base64-url]
version = "3.0"
optional = true

# Android-specific dependencies (target-conditional)
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"
libc = "0.2"

[dev-dependencies]
async-trait = { workspace = true }

[features]
fido2 = ["dep:beardog-hid", "dep:ciborium", "dep:base64-url"]
