[package]
name = "beardog-security"
version = "0.1.0"
edition = "2021"
description = "Security and cryptography for BearDog Security Manager"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/beardog"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"
async-trait = "0.1"
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
ring = "0.16"
rustls = "0.21"
base64 = "0.21"
pbkdf2 = "0.12"
subtle = "2.4"
argon2 = "0.5"
ed25519-dalek = "2.0"
chacha20poly1305 = "0.10"

# Internal dependencies
beardog-errors = { path = "../beardog-errors" }
beardog-config = { path = "../beardog-config" }
beardog-threat = { path = "../beardog-threat" }
beardog-workflows = { path = "../beardog-workflows" }
beardog-compliance = { path = "../beardog-compliance" } 