[package]
name = "beardog-security"
version = "0.1.0"
edition = "2021"
description = "Security and cryptography for BearDog Security Manager"
license = "AGPL-3.0-only"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.75"
authors = [ "BearDog Team <team@beardog.dev>",]
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "security", "crypto", "beardog", "encryption", "hsm",]
categories = [ "cryptography", "security", "development-tools",]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
blake3 = "1.5"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
ed25519-dalek = "2.0"
hmac = "0.12"
pbkdf2 = "0.12"
ring = "0.17"
rsa = "0.9.8"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2.5"
zeroize = "1.7"
bytes = "1.5"
tempfile = "3.8"
tokio-stream = "0.1"
thiserror = "2.0"

[dependencies.anyhow]
workspace = true

[dependencies.base64]
workspace = true

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-types]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.futures]
workspace = true

[dependencies.hex]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tokio]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.beardog-threat]
path = "../beardog-threat"

[dependencies.beardog-workflows]
path = "../beardog-workflows"

[dependencies.beardog-compliance]
path = "../beardog-compliance"

[dependencies.beardog-traits]
path = "../beardog-traits"

# FIDO2-specific dependencies
[dependencies.hidapi]
version = "2.4"
optional = true

[dependencies.ciborium]
version = "0.2"
optional = true

[dependencies.base64-url]
version = "3.0"
optional = true

[features]
fido2 = ["dep:hidapi", "dep:ciborium", "dep:base64-url"]
