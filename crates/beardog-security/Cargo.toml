[package]
name = "beardog-security"
version = "0.1.0"
edition = "2021"
description = "Security and cryptography for BearDog Security Manager"
license = "AGPL-3.0"
repository = "https://github.com/ecoPrimals/beardog"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Cryptographic dependencies
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.0"
pbkdf2 = "0.12"
ring = "0.16"
rustls = "0.21"
sha2 = "0.10"
subtle = "2.4"
thiserror = "1.0"

# Internal dependencies
beardog-errors = { path = "../beardog-errors" }
beardog-config = { path = "../beardog-config" }
beardog-threat = { path = "../beardog-threat" }
beardog-workflows = { path = "../beardog-workflows" }
beardog-compliance = { path = "../beardog-compliance" } 