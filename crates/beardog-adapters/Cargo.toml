[package]
name = "beardog-adapters"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "BearDog adapters module"
authors.workspace = true

[features]
default = []
# Enable advanced NestGate ZFS integration (requires fully implemented API)
advanced-nestgate = []

[dependencies]
anyhow = "1.0"
beardog-errors = { workspace = true }
beardog-genetics = { workspace = true }
beardog-config = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid.workspace = true
thiserror = { workspace = true }
async-trait.workspace = true
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
base64 = "0.21"
beardog-security = { workspace = true }
beardog-threat = { workspace = true }
sha2 = "0.10"
chrono = { workspace = true }
semver = { version = "1.0", features = ["serde"] }
serde_yaml = "0.9"

# Dev dependencies for testing
[dev-dependencies]
tokio-test = "0.4"
