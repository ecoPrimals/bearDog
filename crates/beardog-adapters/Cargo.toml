[package]
name = "beardog-adapters"
version.workspace = true
edition = "2024"
description = "BearDog adapters module"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = ["adapters", "integration", "beardog", "ecosystem", "universal"]
categories = ["development-tools", "api-bindings"]
readme = "README.md"
license = "AGPL-3.0-or-later"

[features]
default = []

[lints]
workspace = true

[dependencies]
beardog-config = { workspace = true }
beardog-discovery = { workspace = true }
beardog-errors = { workspace = true }
beardog-traits = { workspace = true }
beardog-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
chrono = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
postcard = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
mdns-sd = { workspace = true, optional = true }
