[package]
name = "beardog-adapters"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "BearDog adapters module"
authors.workspace = true

[features]
default = []
# Enable advanced NestGate ZFS integration (requires fully implemented API)
advanced-nestgate = []

[dependencies]
beardog-errors = { path = "../beardog-errors" }
beardog-traits = { path = "../beardog-traits" }
beardog-types = { path = "../beardog-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"
async-trait = "0.1"
semver = "1.0"
sha2 = "0.10"
# kube = { version = "0.87", features = ["client", "runtime"] }  # Commented out for now

# Dev dependencies for testing
[dev-dependencies]
tokio-test = "0.4"
