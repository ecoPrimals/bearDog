[package]
name = "beardog-adapters"
version = "0.1.0"
edition = "2021"
description = "BearDog adapters module"
repository = "https://github.com/eastgate-software/beardog"
rust-version = "1.75"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "adapters", "integration", "beardog", "ecosystem", "universal",]
categories = [ "development-tools", "integration", "adapters",]
readme = "README.md"

[features]
default = []
advanced-nestgate = []
mdns-discovery = ["mdns-sd"]

[dependencies]
async-trait = "0.1"
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
semver = "1.0"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = "2.1"
blake3 = "1.5"
bincode = "1.3"
hex = "0.4"
mdns-sd = { version = "0.10", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[package.license]
workspace = true

[package.authors]
workspace = true

[dependencies.beardog-config]
path = "../beardog-config"

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.beardog-traits]
path = "../beardog-traits"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.tokio]
version = "1.0"
features = [ "full",]

[dependencies.reqwest]
workspace = true  # Updated from 0.11 to workspace 0.12 with rustls-tls

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.uuid]
version = "1.0"
features = [ "v4", "serde",]
