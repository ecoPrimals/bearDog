[package]
name = "beardog-adapters"
version.workspace = true
edition = "2024"
description = "BearDog adapters module"
repository = "https://github.com/ecoPrimals/beardog"
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"
keywords = [ "adapters", "integration", "beardog", "ecosystem", "universal",]
categories = [ "development-tools", "integration", "adapters",]
readme = "README.md"
license = "AGPL-3.0-or-later"

[features]
default = []
advanced-registry = []
mdns-discovery = ["mdns-sd"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
semver = "1.0"
sha2 = "0.10"
rand = { workspace = true }
ed25519-dalek = "2.1"
blake3 = { version = "1.5", features = ["pure"] }  # Pure Rust (no C assembly) for universal portability
postcard = { workspace = true }
hex = "0.4"
mdns-sd = { version = "0.11", optional = true }  # Standardized to 0.11

[dev-dependencies]
tokio-test = "0.4"

[package.authors]
workspace = true

[dependencies.beardog-config]
path = "../beardog-config"

[dependencies.beardog-discovery]
path = "../beardog-discovery"

[dependencies.beardog-errors]
path = "../beardog-errors"

[dependencies.beardog-traits]
path = "../beardog-traits"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.tokio]
version = "1.0"
features = [ "full",]

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[dependencies.uuid]
version = "1.0"
features = [ "v4", "serde",]
