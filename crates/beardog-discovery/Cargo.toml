[package]
name = "beardog-discovery"
version.workspace = true
edition = "2024"
authors = ["BearDog Team"]
description = "Capability-based service discovery for BearDog - zero hardcoded knowledge"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
readme = "README.md"
keywords = ["discovery", "service-discovery", "mdns", "dns-sd", "consul"]
categories = ["network-programming", "development-tools"]

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
hostname = { workspace = true }
beardog-errors = { workspace = true }

# mDNS discovery (biomeOS owns network discovery — feature-gated, off by default)
mdns-sd = { workspace = true, optional = true }

# URL parsing
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
# biomeOS owns network discovery — these are opt-in for standalone/legacy use
mdns = ["dep:mdns-sd"]
# dns-sd feature suspended until hickory drops async-trait transitive dep

