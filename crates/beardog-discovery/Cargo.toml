[package]
name = "beardog-discovery"
version.workspace = true
edition = "2024"
authors = ["BearDog Team"]
description = "Capability-based service discovery for BearDog - zero hardcoded knowledge"
license = "AGPL-3.0-only"
repository = "https://github.com/eastgate-software/beardog"
readme = "README.md"
keywords = ["discovery", "service-discovery", "mdns", "dns-sd", "consul"]
categories = ["network-programming", "development-tools"]

[lints]
workspace = true

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# mDNS discovery
mdns-sd = "0.11"

# DNS-SD discovery (hickory-resolver is the maintained successor to trust-dns-resolver)
hickory-resolver = "0.25"

# REMOVED: HTTP client (not needed - Unix sockets + mDNS only!)
# reqwest = { workspace = true }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
beardog-errors = { path = "../beardog-errors" }

# Logging
tracing = "0.1"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# URL parsing
url = "2.5"

# Network utilities
local-ip-address = "0.6"
hostname = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["mdns", "dns-sd", "service-registry"]
mdns = []
dns-sd = []
service-registry = []
network-scan = []  # Opt-in only (slow)

