[package]
name = "beardog-discovery"
version.workspace = true
edition = "2024"
authors = ["BearDog Team"]
description = "Capability-based service discovery for BearDog - zero hardcoded knowledge"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
readme = "README.md"
keywords = ["discovery", "service-discovery", "mdns", "dns-sd", "consul"]
categories = ["network-programming", "development-tools"]

[lints]
workspace = true

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# mDNS discovery (biomeOS owns network discovery — feature-gated, off by default)
mdns-sd = { version = "0.11", optional = true }

# DNS-SD discovery (biomeOS owns network discovery — feature-gated, off by default)
hickory-resolver = { version = "0.24", optional = true }

# REMOVED: HTTP client (not needed - Unix sockets + mDNS only!)
# reqwest = { workspace = true }

# Error handling
anyhow = "1.0"
thiserror = { workspace = true }
beardog-errors = { path = "../beardog-errors" }

# Logging
tracing = "0.1"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# URL parsing
url = "2.5"

# Network utilities
local-ip-address = "0.6"
hostname = { workspace = true }

[dev-dependencies]
anyhow = "1.0"
tokio-test = "0.4"
tempfile = "3.10"
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
# biomeOS owns network discovery — these are opt-in for standalone/legacy use
mdns = ["dep:mdns-sd"]
dns-sd = ["dep:hickory-resolver"]

