[package]
name = "beardog-security-registry"
version = "3.0.0"
edition = "2021"
description = "Security-focused node registry implementation"
readme = "README.md"
license = "AGPL-3.0-only"
homepage = "https://github.com/your-org/beardog"
repository = "https://github.com/your-org/beardog"
authors = [ "BearDog Security Team",]
keywords = [ "security", "hsm", "threat-detection", "compliance", "workflow",]
categories = [ "cryptography", "authentication", "web-programming", "network-programming",]
rust-version = "1.70"
documentation = "https://docs.rs/beardog"

[dependencies]
# 100% Pure Rust crypto!
ed25519-dalek = "2.1"

[dev-dependencies]
tokio-test = "0.4"
serde_json = "1.0"

[dependencies.beardog-errors]
workspace = true

[dependencies.beardog-auth]
workspace = true

[dependencies.beardog-security]
path = "../beardog-security"

[dependencies.beardog-core]
path = "../beardog-core"

[dependencies.beardog-types]
path = "../beardog-types"

[dependencies.tokio]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.chrono]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.hex]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.sha2]
workspace = true
