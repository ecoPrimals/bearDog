[package]
name = "beardog-traits"
version.workspace = true
edition = "2024"
authors = [ "BearDog Team <team@beardog.dev>",]
description = "Unified trait system for BearDog ecosystem - provides common abstractions for security, genetics, monitoring, and performance"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/beardog"
keywords = [ "beardog", "traits", "security", "genetics", "abstraction",]
categories = [ "cryptography", "security", "data-structures",]
rust-version = "1.93.0"
homepage = "https://beardog.dev"
documentation = "https://docs.rs/beardog"

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
beardog-errors = { workspace = true }
beardog-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
