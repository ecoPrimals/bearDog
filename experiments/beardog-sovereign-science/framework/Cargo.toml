[package]
name = "beardog-sovereign-science"
version = "1.0.0"
edition = "2021"
authors = ["BearDog Sovereign Science Team"]
description = "Enterprise-scale scientific validation framework for BearDog's security-first distributed systems"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoprimals/beardog"
keywords = ["security", "cryptography", "distributed-systems", "sovereign-science", "validation"]
categories = ["cryptography", "network-programming", "science"]

[workspace]
# Empty workspace table to make this package independent

[lib]
name = "beardog_sovereign_science"
path = "src/lib.rs"

[dependencies]
# Note: BearDog dependencies would be included in production version
# For this experimental framework, we'll use direct dependencies

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
ring = "0.17"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"
blake3 = "1.0"

# Statistics and analysis
statrs = "0.16"
nalgebra = "0.32"
rand = "0.8"

# Monitoring and telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Time and date
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Testing and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Hardware integration
cryptoki = "0.6"  # PKCS#11 interface for HSM

# Network testing
reqwest = { version = "0.11", features = ["json"] }
hyper = { version = "0.14", features = ["full"] }

[dev-dependencies]
tempfile = "3.0"
mockall = "0.11"

[features]
default = ["full-validation"]
full-validation = ["cryptographic", "performance", "security", "dignity", "enterprise"]
cryptographic = []
performance = []
security = []
dignity = []
enterprise = []

[[example]]
name = "basic_validation"
path = "examples/basic_validation.rs"

[[example]]
name = "full_validation"
path = "examples/full_validation.rs"

[[example]]
name = "cryptographic_validation"
path = "examples/cryptographic_validation.rs"

[[example]]
name = "performance_validation"
path = "examples/performance_validation.rs"

[[bench]]
name = "sovereign_science_benchmarks"
harness = false 