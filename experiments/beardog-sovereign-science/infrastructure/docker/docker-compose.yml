# BearDog Sovereign Science - Validation Infrastructure
# Docker Compose configuration for monitoring and validation environment

version: '3.8'

services:
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: beardog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - beardog-net
    labels:
      - "com.beardog.service=prometheus"
      - "com.beardog.description=Metrics collection and storage"

  # Grafana - Metrics visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: beardog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=beardog-admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    networks:
      - beardog-net
    depends_on:
      - prometheus
    labels:
      - "com.beardog.service=grafana"
      - "com.beardog.description=Metrics visualization and dashboards"

  # Alert Manager - Alert routing and management
  alertmanager:
    image: prom/alertmanager:latest
    container_name: beardog-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - beardog-net
    labels:
      - "com.beardog.service=alertmanager"
      - "com.beardog.description=Alert routing and management"

  # Node Exporter - Host metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: beardog-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - beardog-net
    labels:
      - "com.beardog.service=node-exporter"
      - "com.beardog.description=Host system metrics"

  # Validation Framework - BearDog validation service
  # Note: This will be added when BearDog integration is complete
  # validation-framework:
  #   build:
  #     context: ../../framework
  #     dockerfile: Dockerfile
  #   container_name: beardog-validation
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"  # API server
  #     - "9091:9091"  # Prometheus metrics
  #   environment:
  #     - RUST_LOG=info
  #     - PROMETHEUS_ADDR=0.0.0.0:9091
  #   networks:
  #     - beardog-net
  #   depends_on:
  #     - prometheus
  #   labels:
  #     - "com.beardog.service=validation"
  #     - "com.beardog.description=Sovereign science validation framework"

networks:
  beardog-net:
    driver: bridge
    labels:
      - "com.beardog.network=validation"

volumes:
  prometheus-data:
    labels:
      - "com.beardog.data=prometheus"
  grafana-data:
    labels:
      - "com.beardog.data=grafana"
  alertmanager-data:
    labels:
      - "com.beardog.data=alertmanager"

