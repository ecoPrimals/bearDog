# Prometheus Alert Rules for BearDog Sovereign Science Validation

groups:
  # Validation Framework Alerts
  - name: beardog_validation_alerts
    interval: 30s
    rules:
      # Validation failure rate
      - alert: HighValidationFailureRate
        expr: |
          rate(beardog_validation_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          component: validation
        annotations:
          summary: "High validation failure rate detected"
          description: "Validation failure rate is {{ $value }} failures/sec (threshold: 0.1)"

      # Cryptographic operation failures
      - alert: CryptographicOperationFailures
        expr: |
          rate(beardog_crypto_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: cryptography
        annotations:
          summary: "Cryptographic operations failing"
          description: "Crypto failures detected: {{ $value }} failures/sec"

      # Human dignity check failures
      - alert: HumanDignityCheckFailures
        expr: |
          rate(beardog_dignity_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: human-dignity
        annotations:
          summary: "Human dignity checks failing"
          description: "Dignity check failures: {{ $value }} failures/sec"

      # Long-running validation stages
      - alert: LongRunningValidationStage
        expr: |
          beardog_stage_duration_seconds > 300
        for: 1m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Validation stage taking too long"
          description: "Stage {{ $labels.stage }} has been running for {{ $value }}s (threshold: 300s)"

  # System Health Alerts
  - name: system_health_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% (threshold: 85%)"

      # Low disk space
      - alert: LowDiskSpace
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space"
          description: "Disk usage on {{ $labels.device }} is {{ $value }}% (threshold: 85%)"

  # Prometheus System Alerts
  - name: prometheus_alerts
    interval: 30s
    rules:
      # Prometheus scrape failures
      - alert: PrometheusScrapeFailure
        expr: |
          up == 0
        for: 2m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Prometheus unable to scrape target"
          description: "Target {{ $labels.job }} on {{ $labels.instance }} is down"

      # Alert Manager down
      - alert: AlertManagerDown
        expr: |
          up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Alert Manager is down"
          description: "Alert Manager has been down for more than 2 minutes"

  # Security Alerts
  - name: security_alerts
    interval: 30s
    rules:
      # Critical security events
      - alert: CriticalSecurityEvent
        expr: |
          beardog_security_critical_events > 0
        for: 30s
        labels:
          severity: critical
          component: security
        annotations:
          summary: "Critical security event detected"
          description: "A critical security event has been logged. Immediate investigation required."

  # Statistical Validation Alerts  
  - name: statistical_alerts
    interval: 60s
    rules:
      # Low statistical significance
      - alert: LowStatisticalSignificance
        expr: |
          beardog_validation_p_value > 0.05
        for: 1m
        labels:
          severity: warning
          component: statistics
        annotations:
          summary: "Statistical significance below threshold"
          description: "p-value is {{ $value }} (threshold: 0.05)"

      # Low effect size
      - alert: LowEffectSize
        expr: |
          beardog_validation_effect_size < 0.5
        for: 1m
        labels:
          severity: info
          component: statistics
        annotations:
          summary: "Effect size below medium threshold"
          description: "Effect size is {{ $value }} (threshold: 0.5)"

