# Prometheus Configuration for BearDog Sovereign Science Validation

global:
  scrape_interval: 15s       # Scrape targets every 15 seconds
  evaluation_interval: 15s   # Evaluate rules every 15 seconds
  scrape_timeout: 10s        # Scrape timeout after 10 seconds
  
  # Attach these labels to any time series or alerts
  external_labels:
    monitor: 'beardog-sovereign-science'
    environment: 'validation'
    cluster: 'local'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          role: 'monitoring'

  # Alert Manager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          role: 'alerting'

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          role: 'system-metrics'

  # BearDog Validation Framework
  # Uncomment when validation framework is deployed
  # - job_name: 'beardog-validation'
  #   scrape_interval: 5s  # More frequent scraping for validation metrics
  #   static_configs:
  #     - targets: ['validation-framework:9091']
  #       labels:
  #         service: 'validation-framework'
  #         role: 'validation'
  #   metrics_path: '/metrics'

  # BearDog Application Metrics (when integrated)
  # - job_name: 'beardog-app'
  #   scrape_interval: 10s
  #   static_configs:
  #     - targets: ['beardog-app:8080']
  #       labels:
  #         service: 'beardog-application'
  #         role: 'application'

