[package]
name = "beardog-unwrap-migrator"
version = "0.1.0"
authors = ["BearDog Team", "Squirrel Team"]
description = "BearDog-specific unwrap/expect migration tool for eliminating panic sources"
edition = "2021"

[workspace]
# Empty workspace table to make this a standalone tool

[[bin]]
name = "beardog-unwrap-migrator"
path = "src/main.rs"

[lib]
name = "beardog_unwrap_migrator"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
regex = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.0"
beardog-errors = { path = "../../crates/beardog-errors" }
beardog-types = { path = "../../crates/beardog-types" }

[dev-dependencies]
tempfile = "3.0"

# Standalone tool - no BearDog dependencies needed for basic unwrap migration 