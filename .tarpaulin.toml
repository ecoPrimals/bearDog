# Tarpaulin Configuration for BearDog
# Optimized for accurate coverage measurement across the workspace

[default]
# Output formats
out = ["Html", "Json"]
output-dir = "coverage"

# Timeout settings (some tests are slow)
timeout = "300s"

# Follow child processes
follow-exec = true

# Exclude paths
exclude-files = [
    # Test files themselves
    "tests/*",
    "*/tests/*",
    "**/tests.rs",
    "**/test_*.rs",
    
    # Benchmarks
    "benches/*",
    "benchmarks/*",
    
    # Tools and scripts
    "tools/*",
    "scripts/*",
    "ecosystem-bindings/*",
    "ecosystem-templates/*",
    
    # Generated code
    "target/*",
    "*/target/*",
    
    # Archive/old code
    "archive/*",
    "*/archive/*",
]

# Workspace mode
workspace = true

# Run tests (default behavior)
run-types = ["Lib", "Bins"]

# Feature flags
# all-features = true  # Uncomment if needed

# Reporting
# verbose = true
# debug = false

# Engine
engine = "llvm"

# =============================================================================
# Per-Package Configurations (if needed)
# =============================================================================

# Example: Override settings for specific packages
# [[package]]
# name = "beardog-types"
# timeout = "600s"

