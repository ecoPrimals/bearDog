# ULTRA-PEDANTIC CLIPPY CONFIGURATION
msrv = "1.75.0"

# Enable ALL pedantic lints
pedantic = "warn"
nursery = "warn" 
cargo = "warn"

# Specific pedantic lints
too-many-lines = "warn"
missing-docs-in-private-items = "warn"
missing-const-for-fn = "warn"
use-self = "warn"
clone-on-ref-ptr = "warn"
create-dir = "warn"
empty-structs-with-brackets = "warn"
exit = "warn"
filetype-is-file = "warn"
float-cmp-const = "warn"
get-unwrap = "warn"
impl-trait-in-params = "warn"
integer-division = "warn"
let-underscore-must-use = "warn"
lossy-float-literal = "warn"
map-err-ignore = "warn"
mem-forget = "warn"
multiple-inherent-impl = "warn"
mutex-integer = "warn"
needless-collect = "warn"
non-ascii-literal = "warn"
option-option = "warn"
path-buf-push-overwrite = "warn"
print-stdout = "warn"
print-stderr = "warn"
rc-buffer = "warn"
rc-mutex = "warn"
rest-pat-in-fully-bound-structs = "warn"
same-name-method = "warn"
shadow-reuse = "warn"
shadow-same = "warn"
shadow-unrelated = "warn"
string-add = "warn"
string-add-assign = "warn"
string-to-string = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary-self-imports = "warn"
unneeded-field-pattern = "warn"
unseparated-literal-suffix = "warn"
unused-self = "warn"
use-debug = "warn"
verbose-file-reads = "warn"
wildcard-enum-match-arm = "warn"
