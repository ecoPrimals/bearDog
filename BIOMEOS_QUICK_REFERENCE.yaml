# 🐻 BearDog - BiomeOS Quick Reference
# Last Updated: December 25, 2025

beardog:
  # IMPORTANT: BearDog is a CLI tool + library, NOT a server!
  type: "cli_tool_and_library"
  is_server: false
  is_daemon: false
  execution_model: "command_based"
  
  # Status
  production_ready: true
  grade: "A (91/100)"
  zero_hardcoding: true
  
  # How other primals use BearDog
  integration_method: "rust_library"  # Primary
  cargo_dependency: "beardog-core = \"0.9.4\""
  
  # CLI commands (for operations)
  cli_commands:
    entropy: "Entropy collection and seed generation"
    key: "Key management (generate, list, export, import, derive)"
    birdsong: "Lineage-based encryption"
    encrypt: "File encryption"
    decrypt: "File decryption"
    stream_encrypt: "Large file encryption (100GB+)"
    stream_decrypt: "Large file decryption"
    hsm: "HSM operations (discover, list)"
    cross_primal: "Cross-primal secure messaging"
    status: "Show system status"
  
  # Example commands
  examples:
    version: "./beardog --version"
    status: "./beardog status"
    generate_key: "./beardog key generate --name my-key"
    encrypt_file: "./beardog encrypt --input file.txt --output file.enc"
    discover_hsm: "./beardog hsm discover"
  
  # Configuration (for CLI operations)
  config_method: "environment_variables"
  config_count: 57
  key_env_vars:
    BEARDOG_LOG_LEVEL: "info"
    BEARDOG_HSM_TYPE: "yubikey|tpm|software|auto_detect"
    BEARDOG_STORAGE_PATH: "/var/lib/beardog"
    BEARDOG_CONFIG_FILE: "/etc/beardog/config.toml"
  
  # Health check (via CLI or library)
  health_check_cli: "./beardog status"
  health_check_library: "use beardog_core::health::HealthChecker"
  
  # NOT APPLICABLE (BearDog is not a server)
  start_command: "N/A - BearDog is a library, not a server"
  port_config: "N/A - No ports needed (not a server)"
  shutdown_signal: "N/A - No daemon process"
  
  # Library usage (RECOMMENDED for primals)
  library_integration:
    dependencies:
      - "beardog-core = \"0.9.4\""
      - "beardog-tunnel = \"0.9.0\""
      - "beardog-security = \"0.1.0\""
      - "beardog-genetics = \"0.1.0\""
    
    example_rust: |
      use beardog_core::CryptoService;
      
      let crypto = CryptoService::new()?;
      let key = crypto.generate_key()?;
      let encrypted = crypto.encrypt(key, data)?;
  
  # Capabilities (what BearDog provides)
  capabilities:
    - cryptographic_operations
    - key_management
    - hsm_integration
    - genetic_crypto
    - secure_tunneling
    - entropy_collection
    - cross_primal_messaging
  
  # Quality metrics
  test_coverage: "85%"
  total_tests: 3785
  memory_safety: "TOP 0.1%"
  unsafe_blocks: 15  # Android JNI only
  
  # Dependencies
  required_dependencies: []  # Zero!
  optional_dependencies:
    - songbird  # For networking
    - nestgate  # For storage
    - squirrel  # For AI
  
  # Sovereignty
  autonomous: true
  local_first: true
  no_cloud_required: true

# How BiomeOS should integrate BearDog
biomeos_integration:
  primary_method: "cargo_dependency"
  secondary_method: "cli_invocation"
  
  # Add to BiomeOS Cargo.toml
  cargo_toml_example: |
    [dependencies]
    beardog-core = "0.9.4"
    beardog-tunnel = "0.9.0"
  
  # Or use CLI for specific operations
  cli_adapter_example: |
    # Python adapter
    import subprocess
    result = subprocess.run(['./beardog', 'status'], capture_output=True)
    health = json.loads(result.stdout)
  
  # NOT needed (BearDog is not a server)
  not_applicable:
    - port_allocation
    - service_discovery
    - process_management
    - load_balancing
    - graceful_shutdown

# Example health check response
health_response_example:
  status: "healthy"
  version: "0.9.4"
  timestamp: "2025-12-25T03:00:00Z"
  components:
    hsm:
      status: "healthy"
      available: ["yubikey", "tpm", "software"]
      active: "yubikey"
    crypto:
      status: "healthy"
      providers: ["rustcrypto", "ring"]
    storage:
      status: "healthy"
      path: "/var/lib/beardog"
  capabilities: ["crypto", "hsm", "genetics", "btsp", "cross_primal"]

# Integration status
integration_status:
  documentation: "complete"
  testing: "ready"
  production: "ready"
  confidence: "high"
  architecture_note: "CLI tool + library, not a server"
