[package]
name = "beardog-pixel8-android"
version = "1.0.0"
edition = "2021"
description = "BearDog Pixel 8 Pure Rust Android Application"

[lib]
crate-type = ["cdylib"]

[dependencies]
# BearDog core
beardog = { path = "../crates/beardog" }
beardog-tunnel = { path = "../crates/beardog-tunnel", features = ["android_native", "strongbox_hardware"] }
beardog-errors = { path = "../crates/beardog-errors" }

# Async runtime
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "macros"] }

# Logging
tracing = "0.1"
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Android-specific dependencies
[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.8"
ndk-glue = "0.7"
ndk-context = "0.1"
android_logger = "0.13"

[features]
default = ["android-hsm"]
android-hsm = []

# Android build configuration
[package.metadata.android]
package = "com.beardog.pixel8"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28  # Android 9 for StrongBox support
target_sdk_version = 34
compile_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.USE_FINGERPRINT"

[[package.metadata.android.uses_permission]]
name = "android.permission.USE_BIOMETRIC"

[[package.metadata.android.uses_feature]]
name = "android.hardware.strongbox_keystore"
required = true 